<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zengo">
<meta name="theme-color" content="#0e0f10">
<title>Zengo</title>
<meta name="zengo-version" content="2026.11.13-10">
<style>
/* 撮影画面：左にビフォー、右にライブカメラ。横向きでは操作列が右、縦向きでは下。暗いカメラ画面に固定。 */
:root {
  --bg: #0e0f10;
  --panel: #18191b;
  --line: #2c2e31;
  --fg: #f2f2f0;
  --muted: #9a9da3;
  --accent: #ffd23f;
  --danger: #ff6b5b;
  --ok: #4ade80;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font);
  overflow: hidden; -webkit-user-select: none; user-select: none;
  display: grid; grid-template-rows: 1fr auto;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
@media (orientation: landscape) {
  body { grid-template-rows: none; grid-template-columns: 1fr auto; }
}
[hidden] { display: none !important; }

/* ステージ */
.stage { position: relative; container-type: size; min-width: 0; min-height: 0; display: grid; place-items: center; padding: 8px; }
.pair {
  width: min(100cqw, calc(100cqh * var(--pair, 1.125))); aspect-ratio: var(--pair, 1.125); max-width: 100%;
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
}
.pane { position: relative; overflow: hidden; background: var(--panel); border-radius: 4px; }
.pane video, .pane img.photo, .pane .overlay {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
}
.pane .overlay { pointer-events: none; }
/* 重ねたビフォーは色を40%かけて、ライブ映像と見分けやすくする（保存画像には入らない） */
/* 線モード：ビフォーの輪郭だけを線にして重ねる */
.overlay #overlayLines { image-rendering: auto; }
.overlay img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.overlay .tint { position: absolute; inset: 0; background: var(--tint, rgba(255, 30, 30, 0.4)); }
/* 構図合わせのガイド */
/* 動かす方向に合わせて、画面のその方向に出す（上へ＝上のほう、右へ＝右のほう…） */
.guide { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.guide .g {
  position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 4px 7px; border-radius: 10px; text-align: center; white-space: nowrap;
  background: rgba(0,0,0,.62); color: #fff; font-size: 11px; font-weight: 700; line-height: 1.15;
  transform: translate(-50%, -50%);
}
.guide .g.up    { left: 50%; top: 16%; }
.guide .g.down  { left: 50%; top: 88%; }
.guide .g.left  { left: 4px; top: 50%; transform: translateY(-50%); }
.guide .g.right { right: 4px; top: 50%; transform: translateY(-50%); }
.guide .g.fwd   { left: 50%; top: 32%; }
.guide .g.back  { left: 50%; top: 68%; }
.guide .g.rotr  { left: 62%; top: 50%; }
.guide .g.rotl  { left: 38%; top: 50%; }
.guide .g.mid   { left: 50%; top: 50%; }
.guide .g b { font-size: 20px; line-height: 1; color: var(--accent); }
.guide .g.big b { font-size: 28px; }
.guide .g.ok { background: var(--ok); color: #062b12; }
.guide .g.ok b { color: #062b12; }
.guide .g.weak { color: #ccc; }
.tag {
  position: absolute; top: 8px; left: 8px; z-index: 3;
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  padding: 3px 8px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff;
}
.tag.live { background: var(--accent); color: #111; }
/* 自動シャッター用：ビフォーとの一致度 */
.match {
  position: absolute; top: 8px; right: 8px; z-index: 3;
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 3px 8px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff;
}
.match.ok { background: var(--ok); color: #062b12; }
.badges { position: absolute; top: 8px; right: 8px; z-index: 3; display: grid; gap: 4px; justify-items: end; }
.badges .match { position: static; }
.pane.aligned::after { content: ""; position: absolute; inset: 0; border: 4px solid var(--ok); border-radius: 4px; z-index: 5; pointer-events: none; }
.pita {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 4; pointer-events: none;
  background: var(--ok); color: #062b12; font-weight: 800; font-size: 18px; padding: 8px 16px; border-radius: 99px; white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,.35);
}
/* 自動撮影のカウントダウン：満タンの輪が時計回りに減っていき、なくなったら撮る */
.count { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); z-index: 4; width: 68px; height: 68px; pointer-events: none; }
.count svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.count circle { fill: rgba(0,0,0,.45); stroke-width: 6; }
.count .bg { stroke: rgba(255,255,255,.25); }
.count .fg { fill: none; stroke: var(--ok); stroke-linecap: round; stroke-dasharray: 169.65; stroke-dashoffset: 0; }
.count span { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
/* 一度ポンと出てから、ふわっと薄くなって消える */
.pita.pop { animation: pop 1.8s ease-out forwards; }
@keyframes pop {
  0%   { transform: translate(-50%, -50%) scale(.6); opacity: 0 }
  12%  { transform: translate(-50%, -50%) scale(1);  opacity: 1 }
  45%  { opacity: 1 }
  100% { transform: translate(-50%, -50%) scale(1);  opacity: 0 }
}
@media (prefers-reduced-motion: reduce) { .pita.pop { animation: none; opacity: 0; } }
.gear {
  position: absolute; z-index: 6; top: 8px; left: 8px;
  min-height: 32px; padding: 4px 10px; font-size: 12px; border-radius: 99px;
  background: rgba(24,25,27,.85);
}
.update {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
  background: rgba(20,20,22,.95); border: 1px solid var(--accent); border-radius: 12px; padding: 6px 6px 6px 12px; font-size: 13px;
}
.update button { min-height: 32px; padding: 4px 12px; }
/* カメラの上の 3×3 グリッドと水平線 */
.cam-deco { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.grid3 {
  position: absolute; inset: 0;
  background:
    linear-gradient(to right, transparent calc(33.333% - .5px), rgba(255,255,255,.45) calc(33.333% - .5px), rgba(255,255,255,.45) calc(33.333% + .5px), transparent calc(33.333% + .5px),
      transparent calc(66.667% - .5px), rgba(255,255,255,.45) calc(66.667% - .5px), rgba(255,255,255,.45) calc(66.667% + .5px), transparent calc(66.667% + .5px)),
    linear-gradient(to bottom, transparent calc(33.333% - .5px), rgba(255,255,255,.45) calc(33.333% - .5px), rgba(255,255,255,.45) calc(33.333% + .5px), transparent calc(33.333% + .5px),
      transparent calc(66.667% - .5px), rgba(255,255,255,.45) calc(66.667% - .5px), rgba(255,255,255,.45) calc(66.667% + .5px), transparent calc(66.667% + .5px));
}
/* 水平線：左右の短い線は固定、まん中の線が傾きに合わせて回る。水平になると1本につながって黄色になる */
.level { position: absolute; left: 50%; top: 50%; width: 64%; height: 0; transform: translate(-50%, -50%); }
.level span { position: absolute; top: -1px; height: 2px; background: rgba(255,255,255,.85); box-shadow: 0 0 2px rgba(0,0,0,.6); }
.level .lv-l { left: 0; width: 14%; }
.level .lv-r { right: 0; width: 14%; }
.level .lv-c { left: 20%; width: 60%; transition: transform .08s linear; }
.level.flat span { background: var(--accent); }
.level.flat .lv-c { left: 0; width: 100%; }
.level.flat .lv-l, .level.flat .lv-r { opacity: 0; }
.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
.sheet {
  width: min(420px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 16px; display: grid; gap: 10px;
}
.sheet h2 { margin: 0 0 4px; font-size: 17px; }
.sheet .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sheet .row span { display: grid; gap: 2px; }
.sheet .row small { color: var(--muted); font-size: 12px; }
.sheet .row input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }
.sheet .sec { display: grid; gap: 2px; justify-items: end; flex: none; width: 130px; }
.sheet .sec input { width: 100%; height: auto; accent-color: var(--accent); }
.sheet .sec output { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sheet .note { color: var(--muted); font-size: 12px; margin: 4px 0; }
.placeholder {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px;
  color: var(--muted); padding: 12px; font-size: 13px;
}
.placeholder b { color: var(--fg); font-size: 15px; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
.flash.on { animation: flash .25s ease-out; }
@keyframes flash { from { opacity: .85 } to { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .flash.on { animation: none; } }

.result { width: 100%; height: 100%; display: grid; place-items: center; gap: 6px; grid-template-rows: 1fr auto; min-height: 0; }
.result img { max-width: 100%; max-height: 100%; object-fit: contain; min-height: 0; border-radius: 4px; -webkit-user-select: auto; -webkit-touch-callout: default; }
.hint { color: var(--muted); font-size: 12px; text-align: center; }
.msg {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10;
  background: rgba(20,20,22,.92); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px;
  font-size: 13px; max-width: calc(100% - 32px); text-align: center;
}

/* 操作列：ビフォー／アフターで部品の位置が動かないよう、場所を固定したグリッドにする */
.controls { background: var(--bg); border-top: 1px solid var(--line); padding: 10px 12px 12px; }
.cap {
  display: grid; gap: 10px 12px; align-items: center;
  grid-template-columns: 1fr auto 1fr;
  grid-template-areas: "tools tools tools" "a shutter b";
}
.res { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; min-height: 72px; }
.side { display: contents; }
.tools { grid-area: tools; display: grid; justify-content: center; gap: 8px; }
.tool { display: flex; align-items: center; gap: 8px; }
.tint-btn { width: 76px; height: 34px; min-height: 34px; padding: 0 6px; flex: none; font-size: 12px; font-weight: 700; gap: 5px; }
.tint-btn.on { background: var(--accent); color: #111; border-color: var(--accent); }
.tint-btn.wide { width: 104px; }
.btn-pair { display: flex; gap: 4px; width: 104px; flex: none; }
#modeBtn { gap: 1px; padding: 0 2px; font-size: 11px; font-weight: 500; color: var(--muted); width: 62px; }
#tintBtn { width: 38px; padding: 0 2px; gap: 2px; font-size: 11px; }
#modeBtn .cur { color: var(--accent); font-weight: 800; }
.half-btn { width: 50px; height: 34px; min-height: 34px; padding: 0 4px; font-size: 12px; font-weight: 700; gap: 3px; white-space: nowrap; }
.swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); flex: none; }
.zone-a { grid-area: a; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.zone-a-row { display: flex; gap: 4px; }
.front-btn { width: 38px; height: 38px; min-height: 38px; padding: 0; border-radius: 50%; align-self: center; }
.front-btn.on { background: var(--accent); color: #111; border-color: var(--accent); }
/* レンズ：0.5x を上、1x・2x を下に並べた三角形。0.5x のないとき（インカメなど）も場所は空けておく */
.lens { display: grid; grid-template-columns: 40px 40px; grid-template-areas: "uw uw" "w1 w2"; gap: 4px; justify-content: center; }
.lens .uw { grid-area: uw; justify-self: center; }
.lens .w1 { grid-area: w1; }
.lens .w2 { grid-area: w2; }
.lens button { width: 40px; min-width: 0; height: 34px; min-height: 34px; padding: 0; border-radius: 99px; font-size: 12px; font-weight: 700; }
.ratio-btn { width: 76px; height: 34px; min-height: 34px; padding: 0; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.zone-b { grid-area: b; display: grid; gap: 6px; justify-items: center; }
.shutter-cell { grid-area: shutter; }
@media (orientation: landscape) {
  .controls {
    width: 236px; overflow-y: auto; border-top: 0; border-left: 1px solid var(--line); padding: 10px 8px;
    display: grid;
  }
  /* 横持ち：シャッターを縦方向のまん中に固定。上に重ね・自動、下にレンズと写真選択 */
  .cap {
    grid-template-columns: 1fr; justify-items: center;
    grid-template-rows: 1fr auto 1fr; gap: 8px;
    grid-template-areas: "tools" "shutter" "side";
    height: 100%;
  }
  .tools { grid-template-columns: auto auto; gap: 8px; align-self: end; }
  .tool { flex-direction: column; gap: 6px; }
  .tint-btn { width: 104px; }
  .side { grid-area: side; display: flex; flex-direction: column; gap: 8px; align-self: start; width: 100%; align-items: center; }
  .zone-a { flex-direction: row; justify-content: center; align-items: center; gap: 8px; }
  .zone-a-row { flex-direction: column; align-items: center; }
  .zone-b { grid-template-columns: 1fr 1fr; }
  .zone-b > * { min-height: 46px; font-size: 12px; }
  .zone-b { align-self: start; width: 100%; }
  .zone-b > * { width: 100%; }
  .res { flex-direction: column; align-content: center; }
  .res > * { width: 100%; }
}
.invis { visibility: hidden; }
@media (orientation: landscape) { .gear { top: auto; bottom: 8px; } }
.group { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
button, .btn {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 38px; text-align: center;
}
button:focus-visible, .btn:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:active, .btn:active { transform: scale(.97); }
button.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }

.overlay-btn {
  width: 104px; height: 38px; min-height: 38px; padding: 0; flex: none;
  font-weight: 700; white-space: nowrap; letter-spacing: .02em;
}
@media (orientation: landscape) { .controls .overlay-btn { width: 104px; } }
.shutter {
  width: 72px; height: 72px; border-radius: 50%; padding: 0; background: #fff;
  border: 4px solid var(--bg); box-shadow: 0 0 0 3px #fff; flex: none;
}
.slider { display: grid; gap: 2px; font-size: 11px; color: var(--muted); text-align: center; width: 128px; }
@media (orientation: landscape) { .slider { width: 104px; } }
.slider input { width: 100%; accent-color: var(--accent); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.btn input[type=file] { display: none; }
.small { font-size: 12px; padding: 6px 8px; min-height: 32px; color: var(--muted); }
</style>
</head>
<body>

<main class="stage" id="stage">
  <button class="gear" id="gearBtn" aria-label="設定を開く">⚙︎ 設定</button>
  <div class="pair" id="pair">
    <div class="pane" id="paneL">
      <span class="tag" id="tagL">BEFORE</span>
      <img class="photo" id="beforeImg" alt="ビフォー写真" hidden>
      <div class="flash" id="flashL"></div>
    </div>
    <div class="pane" id="paneR">
      <span class="tag" id="tagR">AFTER</span>
      <div class="placeholder" id="phR"><b>アフター</b>先に左側でビフォーを撮るか、<br>写真から選んでください</div>
      <div class="overlay" id="overlay" hidden><img id="overlayImg" alt=""><span class="tint" id="overlayTint"></span><img id="overlayLines" alt="" hidden></div>
      <div class="badges">
        <div class="match" id="match" hidden>一致 --%</div>
        <div class="match" id="tilt" hidden></div>
      </div>
      <div class="pita" id="pita" hidden>ピタッ！</div>
      <div class="count" id="count" hidden aria-live="polite">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="27"></circle><circle class="fg" id="countArc" cx="32" cy="32" r="27"></circle></svg>
        <span id="countText">1.5</span>
      </div>
      <div class="guide" id="guide" hidden></div>
      <div class="flash" id="flashR"></div>
    </div>
  </div>

  <div class="result" id="result" hidden>
    <img id="resultImg" alt="ビフォーアフター画像">
    <div class="hint" id="resultHint">画像を長押しでも保存できます</div>
  </div>

  <div class="msg" id="msg" hidden></div>
  <div class="update" id="update" hidden>新しい版があります <button class="primary" id="updateBtn" type="button">更新する</button></div>
</main>

<video id="video" playsinline muted autoplay></video>
<div class="cam-deco" id="camDeco">
  <div class="grid3" id="grid3"></div>
  <div class="level" id="level" hidden><span class="lv-l"></span><span class="lv-c" id="levelC"></span><span class="lv-r"></span></div>
</div>

<nav class="controls" id="controls">
  <!-- 撮影中：どの段階でも同じ場所に同じ部品が来る -->
  <div class="cap" id="cap">
    <div class="tools" id="tools">
      <div class="tool">
        <button class="overlay-btn on" id="overlayBtn" aria-pressed="true">重ねON</button>
        <div class="slider" id="opacityWrap">
          <label for="opacity">重ねる濃さ <span id="opacityVal">40%</span></label>
          <input type="range" id="opacity" min="10" max="90" step="10" value="40">
        </div>
        <div class="btn-pair" id="overlayOpts">
          <button class="half-btn mode-btn" id="modeBtn" aria-label="重ね方を切り替える（線／写真）"><span id="modeLine">線</span>⇔<span id="modePhoto">写真</span></button>
          <button class="half-btn" id="tintBtn" aria-label="重ねる色を切り替える"><span class="swatch" id="tintSwatch"></span><span id="tintName">赤</span></button>
        </div>
      </div>
      <div class="tool">
        <button class="overlay-btn" id="autoBtn" aria-pressed="false">自動撮影OFF</button>
        <div class="slider" id="thresholdWrap">
          <label for="threshold">一致 <span id="thresholdVal">80%</span> <span id="thresholdWord">でピタッ</span></label>
          <input type="range" id="threshold" min="50" max="90" step="5" value="80">
        </div>
        <button class="tint-btn wide" id="guideBtn" aria-pressed="false">ガイドOFF</button>
      </div>
    </div>
    <div class="shutter-cell"><button class="shutter" id="shutter" aria-label="撮影"></button></div>
    <div class="side">
    <div class="zone-a">
      <div class="lens" id="lens" aria-label="レンズ"></div>
      <div class="zone-a-row">
        <button class="ratio-btn" id="ratioBtn" aria-label="写真の縦横比を切り替える">比率 16:9</button>
        <button class="front-btn" id="frontBtn" aria-pressed="false" aria-label="インカメと背面カメラを切り替える" title="インカメ⇔背面カメラ"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11a7 7 0 0 1 13.9-1.2"/><path d="M21.3 7.6 19 10.6l-3-2.1"/><path d="M19 13a7 7 0 0 1-13.9 1.2"/><path d="M2.7 16.4 5 13.4l3 2.1"/></svg></button>
      </div>
    </div>
    <div class="zone-b">
      <label class="btn" id="pickBtn">
        <span id="pickLabel">ビフォーを写真から選ぶ</span>
        <input type="file" id="pickInput" accept="image/*">
      </label>
      <button class="small" id="redoBefore">ビフォーを撮り直す</button>
    </div>
    </div>
  </div>

  <!-- 完成 -->
  <div class="res" id="res" hidden>
    <button class="primary" id="saveBtn">保存・共有</button>
    <label class="check" id="labelWrap"><input type="checkbox" id="labelToggle" checked> 文字を入れる</label>
    <button id="ratioBtn2" aria-label="写真の縦横比を切り替える">比率 16:9</button>
    <button id="retakeAfter">アフター撮り直し</button>
    <button class="small" id="newBtn">最初から</button>
  </div>
</nav>

<!-- 設定 -->
<div class="sheet-back" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">設定</h2>
    <label class="row"><span><b>ピタッの音</b><small>ビフォーと合ったときに「ピッピッ」と鳴らす</small></span><input type="checkbox" id="setPing"></label>
    <label class="row"><span><b>シャッター音</b><small>撮影したときに「カシャ」と鳴らす</small></span><input type="checkbox" id="setShutter"></label>
    <div class="row"><span><b>自動撮影までの時間</b><small>合ってから撮影するまでの待ち時間（輪が減る時間）</small></span>
      <span class="sec"><input type="range" id="setCount" min="0.3" max="1.5" step="0.1" value="1"><output id="setCountVal">1.0秒</output></span></div>
    <label class="row"><span><b>グリッド</b><small>カメラの上に 3×3 の線を出す</small></span><input type="checkbox" id="setGrid"></label>
    <label class="row"><span><b>水平線</b><small>画面のまん中に、傾くと回る線を出す（水平になると黄色の1本になる）</small></span><input type="checkbox" id="setLevel"></label>
    <label class="row"><span><b>傾きセンサー</b><small>ビフォーを撮ったときのスマホの傾きと比べて表示する</small></span><input type="checkbox" id="setTilt"></label>
    <p class="note">マナーモード（消音）のときは、音が鳴らないことがあります。<br>傾きは、このアプリのカメラでビフォーを撮ったときだけ比べられます（写真から選んだビフォーには傾きの記録がありません）。</p>
    <p class="note">版：<span id="verText"></span>　<button class="small" id="checkUpdate" type="button">新しい版を確認</button></p>
    <button class="primary" id="sheetClose">閉じる</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const video = $('video');
  const MAX_H = 2400;          // 1枚あたりの最大の高さ(px)。iPhoneのメモリ上限に余裕を持たせる
  // 1枚ごとの縦横比（幅／高さ）。どれも縦長
  const RATIOS = [
    { key: '169', name: '16:9', ar: 9 / 16 },
    { key: '43',  name: '4:3',  ar: 3 / 4 },
    { key: '11',  name: '1:1',  ar: 1 },
  ];
  let ratioIdx = Math.max(0, RATIOS.findIndex(r => r.key === (() => { try { return JSON.parse(localStorage.getItem('bacam.ratio')); } catch { return null; } })()));
  let AR = RATIOS[ratioIdx].ar;

  const store = {
    get(k, d) { try { const v = localStorage.getItem('bacam.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('bacam.' + k, JSON.stringify(v)); } catch {} },
  };

  let state = 'before';        // before | after | result
  let stream = null;
  let cams = [];               // {id, key, name}
  let lensKey = store.get('lens', 'uw');
  let starting = null;
  let beforeCanvas = null, afterCanvas = null;
  let beforeFull = null, afterFull = null;   // 切り抜く前の写真（比率を後から変えられるように残す）
  let beforeURL = null, resultBlob = null, resultURL = null;
  let overlayOn = store.get('overlayOn', true);
  // 前の版で保存した値も、今の目盛り（範囲と刻み）に合わせる
  const snap = (v, min, max, step, d) => { v = Number(v); if (!isFinite(v)) v = d; return Math.min(max, Math.max(min, Math.round((v - min) / step) * step + min)); };
  let opacity = snap(store.get('opacity', 40), 10, 90, 10, 40);
  let msgTimer = null;
  let autoOn = store.get('autoOn', false);
  const TINTS = [
    { key: 'red',   name: '赤', css: 'rgba(255, 30, 30, 0.4)',  line: [255, 50, 50] },
    { key: 'blue',  name: '青', css: 'rgba(30, 110, 255, 0.4)', line: [60, 150, 255] },
    { key: 'green', name: '緑', css: 'rgba(30, 220, 70, 0.4)',  line: [40, 235, 90] },
    { key: 'none',  name: 'なし', css: 'transparent',            line: [255, 255, 255] },
  ];
  let tintIdx = Math.max(0, TINTS.findIndex(t => t.key === store.get('tint', 'red')));
  const settings = { ping: store.get('setPing', true), shutterSound: store.get('setShutter', true), tilt: store.get('setTilt', true),
    countSec: Math.round(snap(store.get('setCount', 1), 0.3, 1.5, 0.1, 1) * 10) / 10,
    grid: store.get('setGrid', true), level: store.get('setLevel', true) };
  let lineMode = store.get('lineMode', true);   // true：線で重ねる／false：写真を薄く重ねる
  let lineMask = null, lineURL = null, lineColorKey = null;
  let guide = null;
  let guideOn = false;   // 最初はガイドなしで合わせ、最後の微調整で使う想定。アフター画面に入るたびにOFFから始める
  let threshold = snap(store.get('threshold', 80), 50, 90, 5, 80);
  let beforeFeat = null, matchScore = null, holdSince = 0, afterEnteredAt = 0, shooting = false;

  $('labelToggle').checked = store.get('labels', true);
  $('opacity').value = opacity;

  function msg(text, ms = 3500) {
    const el = $('msg'); el.textContent = text; el.hidden = false;
    clearTimeout(msgTimer); if (ms) msgTimer = setTimeout(() => el.hidden = true, ms);
  }

  // ---------- カメラ ----------
  // レンズの選択肢：背面は 0.5x（超広角）／1x／2x（1xの映像を中央2倍に切り出す）、インカメは 1x／2x
  // 望遠（3x・5x）は、ボタンが並びきらないので出していない
  let frontCam = null;        // インカメ（前面カメラ）
  let facing = store.get('facing', 'back');   // 'back' | 'user'
  let dzoom = 1;              // 画面の中で拡大する倍率（2x のとき 2）
  let mirror = false;         // インカメのときは鏡のように左右反転して表示・保存する
  function classify(label, i) {
    const l = (label || '').toLowerCase();
    if (/前面|front|user|facetime/.test(l)) return { key: 'front', name: 'イン', front: true };
    if (/超広角|ultra ?wide/.test(l)) return { key: 'uw', name: '0.5x' };
    if (/デュアル|トリプル|dual|triple/.test(l)) return null;
    if (/望遠|telephoto/.test(l)) return { key: 'tele', name: '望遠' };
    if (/背面|back|rear|environment/.test(l)) return { key: 'wide', name: '1x' };
    return { key: 'cam' + i, name: 'カメラ' + (i + 1) };
  }

  async function listCams() {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const out = [], seen = {};
    devs.forEach((d, i) => {
      const c = classify(d.label, i); if (!c) return;
      if (c.front) { if (!frontCam) frontCam = { id: d.deviceId }; return; }
      if (c.key === 'tele') return;
      if (seen[c.key]) { seen[c.key]++; c.key += seen[c.key]; c.name += '-' + seen[c.key]; } else seen[c.key] = 1;
      out.push({ id: d.deviceId, zoom: 1, ...c });
    });
    const order = { uw: 0, wide: 1 };
    out.sort((a, b) => (order[a.key] ?? 9) - (order[b.key] ?? 9));
    const base = out.find(c => c.key === 'wide') || out.find(c => c.key !== 'uw') || out[0];
    if (base) out.splice(out.indexOf(base) + 1, 0, { id: base.id, key: 'x2', name: '2x', zoom: 2 });
    return out;
  }

  function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; video.srcObject = null;
  }

  async function open(constraint) {
    stopCamera();
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { ...constraint, width: { ideal: 4032 }, height: { ideal: 3024 } },
    });
    video.srcObject = stream;
    try { await video.play(); } catch {}
  }

  // 今のレンズの選択肢（背面かインカメか）
  function lensOptions() {
    if (facing === 'user') {
      if (!frontCam) return [];
      return [{ id: frontCam.id, key: 'f1', name: '1x', zoom: 1, front: true }, { id: frontCam.id, key: 'f2', name: '2x', zoom: 2, front: true }];
    }
    return cams;
  }
  function curLens() { return lensOptions().find(c => c.key === (facing === 'user' ? frontKey : lensKey)); }
  let frontKey = store.get('frontLens', 'f1');
  function applyView() {
    const L = curLens();
    dzoom = L ? L.zoom : 1;
    mirror = facing === 'user';
    video.style.transform = (mirror ? 'scaleX(-1) ' : '') + (dzoom !== 1 ? 'scale(' + dzoom + ')' : '');
  }

  async function startCamera() {
    if (starting) return starting;
    starting = (async () => {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error(location.protocol === 'https:' ? 'このブラウザはカメラに対応していません' : 'https のページで開いてください');
      }
      if (facing === 'user') {
        // インカメ：IDがわかっていればそれで、なければ「前面」を指定して開く
        await open(frontCam ? { deviceId: { exact: frontCam.id } } : { facingMode: { exact: 'user' } });
        if (!cams.length) cams = await listCams();
        applyView(); renderLens();
        return;
      }
      // 前回使ったレンズのIDで直接開き、カメラの起動を1回で済ませる（起動のたびにブラウザの通知が出るため）
      const want = cams.find(c => c.key === lensKey);
      const savedId = store.get('camId', null);
      if (want) await open({ deviceId: { exact: want.id } });
      else if (savedId) {
        try { await open({ deviceId: { exact: savedId } }); }
        catch (e) {
          if (e.name === 'NotAllowedError' || e.name === 'SecurityError') throw e;
          await open({ facingMode: { ideal: 'environment' } });
        }
      } else await open({ facingMode: { ideal: 'environment' } });
      if (!cams.length) {
        cams = await listCams();
        const cur = stream.getVideoTracks()[0]?.getSettings().deviceId;
        const pref = cams.find(c => c.key === lensKey) || cams.find(c => c.id === cur) || cams[0];
        if (pref && pref.id !== cur) await open({ deviceId: { exact: pref.id } });
        if (pref) lensKey = pref.key;
      }
      store.set('camId', (cams.find(c => c.key === lensKey) || {}).id || stream.getVideoTracks()[0]?.getSettings().deviceId || null);
      applyView(); renderLens();
    })().catch(err => {
      stopCamera();
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      showCamError(denied
        ? 'カメラの使用が許可されていません。Chromeはアドレスバー左のアイコン、Safariは「ぁあ」→「Webサイトの設定」から、カメラを「許可」にしてください。'
        : 'カメラを起動できませんでした（' + (err.message || err.name) + '）');
    }).finally(() => { starting = null; });
    return starting;
  }

  function showCamError(text) {
    const pane = state === 'before' ? $('paneL') : $('paneR');
    let ph = pane.querySelector('.camerr');
    if (!ph) { ph = document.createElement('div'); ph.className = 'placeholder camerr'; pane.appendChild(ph); }
    ph.innerHTML = '';
    const b = document.createElement('b'); b.textContent = 'カメラが使えません';
    const p = document.createElement('div'); p.textContent = text;
    const p2 = document.createElement('div'); p2.textContent = '「写真から選ぶ」で、標準カメラで撮った写真も使えます。';
    ph.append(b, p, p2);
  }
  function clearCamError() { document.querySelectorAll('.camerr').forEach(e => e.remove()); }

  function renderLens() {
    const box = $('lens'); box.innerHTML = '';
    $('frontBtn').classList.toggle('on', facing === 'user');
    $('frontBtn').setAttribute('aria-pressed', String(facing === 'user'));
    const opts = lensOptions();
    const curKey = facing === 'user' ? frontKey : lensKey;
    // 決まった3つの場所（上：0.5x／左下：1x／右下：2x）に置く。ないものは見えない空きにして、ボタンが動かないようにする
    const slots = {
      uw: opts.find(c => c.key === 'uw'),
      w1: opts.find(c => c.zoom === 1 && c.key !== 'uw'),
      w2: opts.find(c => c.zoom === 2),
    };
    ['uw', 'w1', 'w2'].forEach(slot => {
      const c = slots[slot];
      const b = document.createElement('button');
      if (!c || state === 'result') {
        b.className = slot + ' invis'; b.tabIndex = -1; b.setAttribute('aria-hidden', 'true');
        b.textContent = slot === 'uw' ? '0.5x' : slot === 'w1' ? '1x' : '2x';
        box.appendChild(b); return;
      }
      b.textContent = slot === 'w1' ? '1x' : c.name; b.className = slot + (c.key === curKey ? ' on' : '');
      b.setAttribute('aria-pressed', c.key === curKey);
      b.onclick = async () => {
        if (c.key === curKey && stream) return;
        const prev = curLens();
        if (facing === 'user') { frontKey = c.key; store.set('frontLens', frontKey); }
        else { lensKey = c.key; store.set('lens', lensKey); }
        // 同じカメラで倍率だけ変えるときは、カメラを開き直さない（Chromeの通知を出さないため）
        if (prev && prev.id === c.id && cameraAlive()) { applyView(); renderLens(); return; }
        renderLens();
        await startCamera();
      };
      box.appendChild(b);
    });
  }
  // インカメ⇔背面カメラの切り替え
  async function toggleFront() {
    facing = facing === 'user' ? 'back' : 'user'; store.set('facing', facing);
    stopCamera(); renderLens();
    await startCamera();
    if (facing === 'user' && !cameraAlive()) { facing = 'back'; store.set('facing', facing); msg('インカメを起動できませんでした'); await startCamera(); }
  }

  // ---------- 画像処理 ----------
  function cropCover(src, sw, sh) {
    let cw, ch;
    if (sw / sh > AR) { ch = sh; cw = sh * AR; } else { cw = sw; ch = sw / AR; }
    const sx = (sw - cw) / 2, sy = (sh - ch) / 2;
    const s = Math.min(1, MAX_H / ch);
    const c = document.createElement('canvas');
    c.width = Math.round(cw * s); c.height = Math.round(ch * s);
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
    g.drawImage(src, sx, sy, cw, ch, 0, 0, c.width, c.height);
    return c;
  }

  // 切り抜かずに、長い辺を MAX_H までに縮めて取っておく
  // z：中央を z 倍に切り出す（2x 用）／flip：左右反転（インカメ用）
  function fullCanvas(src, sw, sh, z = 1, flip = false) {
    const cw = sw / z, ch = sh / z, sx = (sw - cw) / 2, sy = (sh - ch) / 2;
    const s = Math.min(1, MAX_H / Math.max(cw, ch));
    const c = document.createElement('canvas');
    c.width = Math.round(cw * s); c.height = Math.round(ch * s);
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
    if (flip) { g.translate(c.width, 0); g.scale(-1, 1); }
    g.drawImage(src, sx, sy, cw, ch, 0, 0, c.width, c.height);
    return c;
  }
  const cropOf = (c) => cropCover(c, c.width, c.height);

  function grabFrame() {
    if (!stream || !video.videoWidth) return null;
    return fullCanvas(video, video.videoWidth, video.videoHeight, dzoom, mirror);
  }

  async function loadFile(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image(); img.src = url; await img.decode();
      return fullCanvas(img, img.naturalWidth, img.naturalHeight);
    } finally { URL.revokeObjectURL(url); }
  }

  const toBlob = (c, q = 0.92) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('画像を作れませんでした')), 'image/jpeg', q));

  function compose(withLabels) {
    const H = Math.min(beforeCanvas.height, afterCanvas.height);
    const W = Math.round(H * AR);
    const gap = Math.round(W * 0.02);
    const c = document.createElement('canvas');
    c.width = W * 2 + gap; c.height = H;
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(beforeCanvas, 0, 0, W, H);
    g.drawImage(afterCanvas, W + gap, 0, W, H);
    if (withLabels) {
      const fs = Math.round(H * 0.05), pad = Math.round(fs * 0.55), m = Math.round(H * 0.03);
      g.font = `800 ${fs}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
      g.textBaseline = 'middle';
      [['BEFORE', 0, 'rgba(0,0,0,0.6)', '#ffffff'], ['AFTER', W + gap, 'rgba(255,210,63,0.95)', '#111111']].forEach(([t, x, bg, fg]) => {
        const tw = g.measureText(t).width, bw = tw + pad * 2, bh = fs + pad * 1.2, bx = x + m, by = m;
        g.fillStyle = bg; roundRect(g, bx, by, bw, bh, bh / 2); g.fill();
        g.fillStyle = fg; g.fillText(t, bx + pad, by + bh / 2 + fs * 0.04);
      });
    }
    return c;
  }
  function roundRect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  // ---------- 画面の切り替え ----------
  function flash(id) { const f = $(id); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }

  function render() {
    const isB = state === 'before', isA = state === 'after', isR = state === 'result';
    $('pair').hidden = isR; $('result').hidden = !isR;

    // ビデオの置き場所
    if (isB) { $('paneL').insertBefore(video, $('beforeImg')); $('paneL').insertBefore($('camDeco'), $('beforeImg')); }
    if (isA) { $('paneR').insertBefore(video, $('overlay')); $('paneR').appendChild($('camDeco')); }
    video.hidden = isR;
    $('camDeco').hidden = isR;
    $('grid3').hidden = !settings.grid;
    if (!isR) video.play().catch(() => {});

    $('beforeImg').hidden = !isA;
    $('phR').hidden = !isB;
    $('tagL').classList.toggle('live', isB);
    $('tagR').classList.toggle('live', isA);
    $('overlay').hidden = !(isA && overlayOn && beforeURL);
    $('overlay').style.opacity = opacity / 100;
    $('opacityVal').textContent = opacity + '%';
    // ボタンには今の状態を書く（オン中は黄色）
    $('overlayBtn').textContent = overlayOn ? '重ねON' : '重ねOFF';
    $('overlayBtn').classList.toggle('on', overlayOn);
    $('overlayBtn').setAttribute('aria-pressed', String(overlayOn));

    // 見えなくする部品も場所は残す（invis）ので、シャッターやボタンの位置が動かない
    $('cap').hidden = isR; $('res').hidden = !isR;
    $('tools').classList.toggle('invis', !isA);
    $('opacityWrap').classList.toggle('invis', !isA || !overlayOn);
    $('autoBtn').textContent = autoOn ? '自動撮影ON' : '自動撮影OFF';
    $('autoBtn').classList.toggle('on', autoOn);
    $('autoBtn').setAttribute('aria-pressed', String(autoOn));
    $('thresholdWrap').classList.toggle('invis', !isA);
    $('thresholdWord').textContent = autoOn ? 'で撮る' : 'でピタッ';
    const tint = TINTS[tintIdx];
    $('overlay').style.setProperty('--tint', tint.css);
    $('tintName').textContent = tint.name;
    $('tintSwatch').style.background = tint.key === 'none' ? 'transparent' : tint.css.replace(/0\.4\)$/, '1)');
    $('overlayOpts').classList.toggle('invis', !isA || !overlayOn);
    $('modeLine').className = lineMode ? 'cur' : ''; $('modePhoto').className = lineMode ? '' : 'cur';
    $('overlayImg').hidden = lineMode; $('overlayTint').hidden = lineMode;
    $('overlayLines').hidden = !lineMode;
    if (lineMode && isA && overlayOn) ensureLines();
    $('ratioBtn').textContent = '比率 ' + RATIOS[ratioIdx].name;
    $('ratioBtn2').textContent = '比率 ' + RATIOS[ratioIdx].name;
    $('guideBtn').textContent = guideOn ? 'ガイドON' : 'ガイドOFF';
    $('guideBtn').classList.toggle('on', guideOn);
    $('guideBtn').setAttribute('aria-pressed', String(guideOn));
    $('threshold').value = threshold;
    $('thresholdVal').textContent = threshold + '%';
    renderMatch();
    $('pickLabel').textContent = isB ? 'ビフォーを写真から選ぶ' : 'アフターを写真から選ぶ';
    $('redoBefore').classList.toggle('invis', !isA);
    renderLens();
  }

  async function go(next) {
    state = next; clearCamError();
    if (next === 'after') { afterEnteredAt = performance.now(); matchScore = null; holdSince = 0; guide = null; guideOn = false; aligned = false; }
    if (next !== 'after') { $('pita').hidden = true; $('paneR').classList.remove('aligned'); $('tilt').hidden = true; }
    render();
    // 完成画面でもカメラは止めない（撮り直しのたびにカメラを起動し直さないため）
    if (next !== 'result' && !cameraAlive()) await startCamera();
  }

  // 画面のビフォーは切り抜く前の写真を枠いっぱいに表示する（枠の比率で自動的に切り抜かれて見える）
  async function setBefore(full) {
    beforeFull = full;
    beforeCanvas = cropOf(full);
    beforeFeat = features(beforeCanvas, beforeCanvas.width, beforeCanvas.height);
    if (beforeURL) URL.revokeObjectURL(beforeURL);
    beforeURL = URL.createObjectURL(await toBlob(full, 0.9));
    $('beforeImg').src = beforeURL; $('overlayImg').src = beforeURL;
    lineMask = null; lineColorKey = null; $('overlayLines').removeAttribute('src');
    await go('after');
  }

  async function setAfter(full) {
    afterFull = full;
    afterCanvas = cropOf(full);
    await buildResult();
    await go('result');
  }

  async function buildResult() {
    const c = compose($('labelToggle').checked);
    resultBlob = await toBlob(c, 0.9);
    if (resultURL) URL.revokeObjectURL(resultURL);
    resultURL = URL.createObjectURL(resultBlob);
    $('resultImg').src = resultURL;
  }

  // ---------- 音（ピタッ／シャッター）：Web Audio で合成する ----------
  let actx = null;
  // iPhoneはマナーモード（消音スイッチ）だと Web の音が消される。

    const base = similarity(before, L0, 0, 0, M);
    let best = { scale: 1, deg: 0, ...sh };
    for (const sc of [0.86, 0.93, 1.07, 1.16]) {
      const r = bestShift(before, featFromA(sc, 0), best.dx, best.dy, 2, 1);
      if (r.s > best.s + 0.5) best = { scale: sc, deg: 0, ...r };
    }
    for (const dg of [-8, -4, 4, 8]) {
      const r = bestShift(before, featFromA(best.scale, dg), best.dx, best.dy, 2, 1);
      if (r.s > best.s + 0.5) best = { ...best, deg: dg, dx: r.dx, dy: r.dy, s: r.s };
    }
    return { ...best, base };
  }

  if (location.hash === '#test') window.__z = { drawA, featFromA, estimate, similarity, matchPercent, FW, FH };

  // しきい値を超えた状態がこの時間続いたら撮る（カウントダウンの長さ。設定で 0.3〜1.5秒）
  const holdMs = () => settings.countSec * 1000;
  const GRACE_MS = 1500;   // アフター画面に入った直後は撮らない
  // 一致度が設定値を超えたら「ピタッ」（緑の枠＋表示＋音）。下がったら（5%の余裕を見て）また鳴らせるようにする
  let aligned = false;
  function renderMatch() {
    const el = $('match');
    el.hidden = state !== 'after' || matchScore === null;
    if (!el.hidden) {
      el.textContent = '一致 ' + Math.round(matchScore) + '% / ' + threshold + '%';
      el.classList.toggle('ok', matchScore >= threshold);
    }
    renderTilt();
    const now = state === 'after' && matchScore !== null && (aligned ? matchScore >= threshold - 5 : matchScore >= threshold);
    if (now && !aligned) {
      playPing();
      const p = $('pita'); p.hidden = false; p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop');
    }
    if (!now) $('pita').hidden = true;
    aligned = now;
    $('paneR').classList.toggle('aligned', aligned);
    renderGuide();
  }

  // ガイドの表示。dx>0 は映像の中身が右にずれている＝スマホを右へ。
  function renderGuide() {
    const el = $('guide');
    el.hidden = state !== 'after' || !guideOn || !guide;
    if (el.hidden) return;
    const items = [];
    const add = (arrow, text, size, cls = '') => items.push(`<span class="g ${cls} ${size >= 2 ? 'big' : ''}"><b>${arrow}</b>${text}</span>`);
    if (guide.lost) { el.innerHTML = '<span class="g mid weak">ビフォーの景色を<br>画面に入れてください</span>'; return; }
    const sx = Math.abs(guide.dx) / FW * 100, sy = Math.abs(guide.dy) / FH * 100;   // 画面に対するずれ（%）
    const lvl = (v, a, b) => v < a ? 0 : v < b ? 1 : 2;
    const lx = lvl(sx, 4, 12), ly = lvl(sy, 3, 10);
    if (ly) add(guide.dy < 0 ? '↑' : '↓', guide.dy < 0 ? '上へ' : '下へ', ly, guide.dy < 0 ? 'up' : 'down');
    if (lx) add(guide.dx < 0 ? '←' : '→', guide.dx < 0 ? '左へ' : '右へ', lx, guide.dx < 0 ? 'left' : 'right');
    const zs = Math.abs(Math.log(guide.scale)) * 100;                                    // 大きさの違い（%）
    const lz = lvl(zs, 5, 12);
    if (lz) add(guide.scale > 1 ? '⇡' : '⇣', guide.scale > 1 ? '前へ' : '後ろへ', lz, guide.scale > 1 ? 'fwd' : 'back');
    const la = lvl(Math.abs(guide.deg), 2.5, 6);
    if (la) add(guide.deg > 0 ? '↺' : '↻', (guide.deg > 0 ? '左に<br>傾ける ' : '右に<br>傾ける ') + Math.round(Math.abs(guide.deg)) + '°', la, guide.deg > 0 ? 'rotl' : 'rotr');
    if (!items.length && $('pita').hidden) add('◎', 'ぴったり', 1, 'ok mid');
    el.innerHTML = items.join('');
  }

  let tick = 0;
  setInterval(() => {
    if (state !== 'after' || !beforeFeat || !stream || !video.videoWidth || shooting || document.hidden || window.__freeze) return;
    drawA(video, video.videoWidth, video.videoHeight, dzoom, mirror);
    const live = featFromA();
    const sc = matchPercent(beforeFeat, live);
    matchScore = matchScore === null ? sc : matchScore * 0.6 + sc * 0.4;
    // ガイドは 2回に1回（約0.3秒ごと）。直前の結果となめらかにつなぐ
    if (guideOn && tick++ % 2 === 0) {
      const e = estimate(beforeFeat);
      if (e.s < 25) guide = { lost: true };
      else if (!guide || guide.lost) guide = e;
      else guide = {
        dx: guide.dx * 0.5 + e.dx * 0.5, dy: guide.dy * 0.5 + e.dy * 0.5,
        scale: Math.exp(Math.log(guide.scale) * 0.5 + Math.log(e.scale) * 0.5),
        deg: guide.deg * 0.5 + e.deg * 0.5,
      };
    }
    renderMatch();
    const now = performance.now();
    if (!autoOn || now - afterEnteredAt < GRACE_MS || matchScore < threshold) { holdSince = 0; return; }
    // 傾きセンサーが使えるときは、傾きも合っているときだけ自動で撮る
    if (renderTilt() === false) { holdSince = 0; return; }
    if (!holdSince) { holdSince = now; requestAnimationFrame(countLoop); }
  }, 150);

  // カウントダウンの輪を毎フレーム描き、時間になったら撮る。合わなくなったら（holdSince=0）消す
  const ARC = 2 * Math.PI * 27;
  function countLoop() {
    const el = $('count');
    if (!holdSince || state !== 'after' || shooting) { el.hidden = true; return; }
    const H = holdMs(), left = Math.max(0, H - (performance.now() - holdSince));
    el.hidden = false;
    $('countArc').style.strokeDashoffset = String(ARC * (1 - left / H));
    $('countText').textContent = (left / 1000).toFixed(1);
    if (left <= 0) { el.hidden = true; shootAfter(); return; }
    requestAnimationFrame(countLoop);
  }

  async function shootAfter() {
    if (shooting) return;
    const frame = grabFrame();
    if (!frame) { msg('カメラの準備中です。少し待ってからもう一度押してください'); return; }
    shooting = true;
    playShutter();
    try { flash('flashR'); await setAfter(frame); } finally { shooting = false; holdSince = 0; }
  }

  // ---------- 操作 ----------
  $('shutter').onclick = async () => {
    askTilt();
    if (state === 'after') return shootAfter();
    const frame = grabFrame();
    if (!frame) { msg('カメラの準備中です。少し待ってからもう一度押してください'); return; }
    if (state === 'before') {
      tiltBefore = tiltNow ? { ...tiltNow } : null;   // ビフォーを撮った瞬間の傾きを覚える
      playShutter(); flash('flashL'); await setBefore(frame);
    }
  };
  // ---------- 新しい版の確認 ----------
  // ホーム画面から開いたアプリは古いページを覚えたままになりやすいので、起動時と画面に戻ったときに確認する
  const myVer = document.querySelector('meta[name="zengo-version"]').content;
  $('verText').textContent = myVer;
  async function checkUpdate(showResult) {
    try {
      const r = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
      const t = await r.text();
      const m = t.match(/name="zengo-version" content="([^"]+)"/);
      if (m && m[1] !== myVer) { $('update').hidden = false; return true; }
      if (showResult) msg('最新の版です（' + myVer + '）');
    } catch { if (showResult) msg('確認できませんでした。電波のよい場所でもう一度お試しください'); }
    return false;
  }
  $('updateBtn').onclick = () => { location.replace(location.pathname + '?v=' + Date.now()); };
  $('checkUpdate').onclick = () => checkUpdate(true);
  checkUpdate(false);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(false); });

  // 設定画面
  const SET = [['setPing', 'ping'], ['setShutter', 'shutterSound'], ['setGrid', 'grid'], ['setLevel', 'level'], ['setTilt', 'tilt']];
  const showCount = () => { $('setCount').value = settings.countSec; $('setCountVal').textContent = settings.countSec.toFixed(1) + '秒'; };
  $('setCount').oninput = (e) => { settings.countSec = Math.round(snap(e.target.value, 0.3, 1.5, 0.1, 1) * 10) / 10; store.set('setCount', settings.countSec); showCount(); };
  $('gearBtn').onclick = () => { SET.forEach(([id, k]) => $(id).checked = settings[k]); showCount(); $('sheet').hidden = false; $('sheetClose').focus(); };
  SET.forEach(([id, k]) => $(id).onchange = (e) => {
    settings[k] = e.target.checked; store.set(id, settings[k]);
    if ((k === 'tilt' && settings.tilt) || (k === 'level' && settings.level)) askTilt();
    if (k === 'level') updateLevel();
    if (k === 'ping' && settings.ping) playPing();
    if (k === 'shutterSound' && settings.shutterSound) playShutter();
    render();
  });
  $('sheetClose').onclick = () => { $('sheet').hidden = true; };
  $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) $('sheet').hidden = true; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('sheet').hidden = true; });
  if (location.hash === '#test') window.__guide = { set(v) { guide = v; guideOn = true; render(); renderGuide(); } };
  if (location.hash === '#test') window.__tilt = { onOrient, get now() { return tiltNow; }, set before(v) { tiltBefore = v; }, renderTilt };

  $('guideBtn').onclick = () => { guideOn = !guideOn; guide = null; render(); };
  $('modeBtn').onclick = () => { lineMode = !lineMode; store.set('lineMode', lineMode); render(); };
  $('tintBtn').onclick = () => { tintIdx = (tintIdx + 1) % TINTS.length; store.set('tint', TINTS[tintIdx].key); render(); };
  $('autoBtn').onclick = () => { autoOn = !autoOn; holdSince = 0; store.set('autoOn', autoOn); render(); };
  $('threshold').oninput = (e) => { threshold = +e.target.value; holdSince = 0; store.set('threshold', threshold); render(); };

  $('pickBtn').addEventListener('click', () => askTilt());
  $('pickInput').onchange = async (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const c = await loadFile(file);
      if (state === 'before') { tiltBefore = null; await setBefore(c); } else if (state === 'after') await setAfter(c);
    } catch { msg('この写真は読み込めませんでした。別の写真を選んでください'); }
  };

  $('opacity').oninput = (e) => { opacity = +e.target.value; store.set('opacity', opacity); render(); };
  $('overlayBtn').onclick = () => { overlayOn = !overlayOn; store.set('overlayOn', overlayOn); render(); };
  $('redoBefore').onclick = () => go('before');
  $('retakeAfter').onclick = () => go('after');
  $('newBtn').onclick = () => { beforeCanvas = afterCanvas = beforeFull = afterFull = null; go('before'); };

  // 比率の切り替え。撮った写真は切り抜く前のものから作り直す
  function applyRatioCss() { document.documentElement.style.setProperty('--pair', String(AR * 2)); }
  async function setRatio(idx) {
    ratioIdx = idx; AR = RATIOS[idx].ar; store.set('ratio', RATIOS[idx].key); applyRatioCss();
    if (beforeFull) { beforeCanvas = cropOf(beforeFull); beforeFeat = features(beforeCanvas, beforeCanvas.width, beforeCanvas.height); }
    if (afterFull) afterCanvas = cropOf(afterFull);
    matchScore = null; guide = null; holdSince = 0;
    render();
    if (state === 'result' && beforeCanvas && afterCanvas) await buildResult();
  }
  const nextRatio = () => setRatio((ratioIdx + 1) % RATIOS.length);
  $('ratioBtn').onclick = nextRatio;
  $('frontBtn').onclick = toggleFront;
  $('ratioBtn2').onclick = nextRatio;
  applyRatioCss();
  $('labelToggle').onchange = async (e) => { store.set('labels', e.target.checked); await buildResult(); };

  $('saveBtn').onclick = async () => {
    if (!resultBlob) return;
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    const name = `BA_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
    const file = new File([resultBlob], name, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (err) { if (err.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = resultURL; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    msg('保存できない場合は、画像を長押しして「"写真"に保存」を選んでください', 6000);
  };

  function cameraAlive() {
    const t = stream && stream.getVideoTracks()[0];
    return !!t && t.readyState === 'live';
  }
  // アプリに戻ったとき、カメラが止められていた場合だけ起動し直す
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state !== 'result' && !cameraAlive()) startCamera();
    if (!document.hidden) video.play().catch(() => {});
  });

  try { navigator.wakeLock?.request('screen').catch(() => {}); } catch {}

  render();
  startCamera();
})();
</script>
</body>
</html>
