<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zengo">
<meta name="theme-color" content="#0e0f10">
<title>Zengo</title>
<meta name="zengo-version" content="2026.11.14-4">
<style>
/* 撮影画面：左にビフォー、右にライブカメラ。横向きでは操作列が右、縦向きでは下。暗いカメラ画面に固定。 */
:root {
  --bg: #0e0f10;
  --panel: #18191b;
  --line: #2c2e31;
  --fg: #f2f2f0;
  --muted: #9a9da3;
  --accent: #ffd23f;
  --danger: #ff6b5b;
  --ok: #4ade80;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font);
  overflow: hidden; -webkit-user-select: none; user-select: none;
  display: grid; grid-template-rows: 1fr auto;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
@media (orientation: landscape) {
  body { grid-template-rows: none; grid-template-columns: 1fr auto; }
}
[hidden] { display: none !important; }

/* ステージ */
.stage { position: relative; container-type: size; min-width: 0; min-height: 0; display: grid; place-items: center; padding: 8px; }
.pair {
  width: min(100cqw, calc(100cqh * var(--pair, 1.125))); aspect-ratio: var(--pair, 1.125); max-width: 100%;
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
}
.pane { position: relative; overflow: hidden; background: var(--panel); border-radius: 4px; }
.pane video, .pane img.photo, .pane .overlay {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
}
.pane .overlay { pointer-events: none; }
.grid-before { z-index: 2; }
/* 重ねたビフォーは色を40%かけて、ライブ映像と見分けやすくする（保存画像には入らない） */
/* 線モード：ビフォーの輪郭だけを線にして重ねる */
.overlay #overlayLines { image-rendering: auto; }
.overlay img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.overlay .tint { position: absolute; inset: 0; background: var(--tint, rgba(255, 30, 30, 0.4)); }
/* 構図合わせのガイド */
/* 動かす方向に合わせて、画面のその方向に出す（上へ＝上のほう、右へ＝右のほう…） */
.guide { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.guide .g {
  position: absolute; display: grid; place-items: center; width: 40px; height: 40px; padding: 0;
  border-radius: 50%; background: rgba(0,0,0,.55); color: #fff;
  transform: translate(-50%, -50%);
}
.guide .g.up    { left: 50%; top: 16%; }
.guide .g.down  { left: 50%; top: auto; bottom: 3px; transform: translateX(-50%); width: 34px; height: 30px; border-radius: 12px; }
/* 「下へ」は画面のいちばん下に小さく出し、傾きのスマホ形の枠と重ならないようにする */
.guide .g.down b, .guide .g.down.big b { font-size: 22px; }
.guide .g.left  { left: 4px; top: 40%; transform: translateY(-50%); }
.guide .g.right { right: 4px; top: 40%; transform: translateY(-50%); }
.guide .g.rotr  { left: 62%; top: 50%; }
.guide .g.rotl  { left: 38%; top: 50%; }
.guide .g.mid   { left: 50%; top: 50%; }
.guide .g b { font-size: 24px; line-height: 1; font-weight: 800; color: var(--accent); }
.guide .g.big b { font-size: 34px; }
.guide .g.ok { background: var(--ok); color: #062b12; }
.guide .g.ok b { color: #062b12; }
.guide .g.weak { color: #ccc; }
.tag {
  position: absolute; top: 8px; left: 8px; z-index: 3;
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  padding: 3px 8px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff;
}
.tag.live { background: var(--accent); color: #111; }
/* 自動シャッター用：ビフォーとの一致度 */
.match {
  position: absolute; top: 8px; right: 8px; z-index: 3;
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 3px 8px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff;
}
.match.ok { background: var(--ok); color: #062b12; }
.badges { position: absolute; top: 8px; right: 8px; z-index: 3; display: grid; gap: 4px; justify-items: end; }
.badges .match { position: static; }
.pane.aligned::after { content: ""; position: absolute; inset: 0; border: 4px solid var(--ok); border-radius: 4px; z-index: 5; pointer-events: none; }
.pita {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 4; pointer-events: none;
  background: var(--ok); color: #062b12; font-weight: 800; font-size: 18px; padding: 8px 16px; border-radius: 99px; white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,.35);
}
/* 自動撮影のカウントダウン：満タンの輪が時計回りに減っていき、なくなったら撮る */
.count { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%); z-index: 4; width: 60px; height: 60px; pointer-events: none; }

.count svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.count circle { fill: rgba(0,0,0,.45); stroke-width: 6; }
.count .bg { stroke: rgba(255,255,255,.25); }
.count .fg { fill: none; stroke: var(--ok); stroke-linecap: round; stroke-dasharray: 169.65; stroke-dashoffset: 0; }
.count span { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
/* 一度ポンと出てから、ふわっと薄くなって消える */
.pita.pop { animation: pop 1.8s ease-out forwards; }
@keyframes pop {
  0%   { transform: translate(-50%, -50%) scale(.6); opacity: 0 }
  12%  { transform: translate(-50%, -50%) scale(1);  opacity: 1 }
  45%  { opacity: 1 }
  100% { transform: translate(-50%, -50%) scale(1);  opacity: 0 }
}
@media (prefers-reduced-motion: reduce) { .pita.pop { animation: none; opacity: 0; } }
/* 左上（横持ちでは左下）：設定と、ビフォーの呼び出し／保存。どの画面でも同じ場所・同じ大きさ */
.topbar { position: absolute; z-index: 6; top: 8px; left: 8px; display: flex; gap: 6px; }
.gear, .topbar button {
  min-height: 32px; padding: 4px 10px; font-size: 12px; border-radius: 99px;
  background: rgba(24,25,27,.85);
}
#keepBtn, #makeBtn { width: 112px; padding: 4px 6px; white-space: nowrap; }
/* 保存したビフォーの一覧 */
.kept { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.kept.wide { grid-template-columns: repeat(2, 1fr); }
.kept .item { display: grid; gap: 2px; justify-items: center; cursor: pointer; -webkit-touch-callout: none; }
.kept .item .frame { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; background: #000; border: 3px solid transparent; }
.kept.wide .item .frame { aspect-ratio: 1; }
.kept .item img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.kept.wide .item img { object-fit: contain; }
.kept .item .ck { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font-size: 14px; font-weight: 800; color: transparent; border: 2px solid rgba(255,255,255,.85); background: rgba(0,0,0,.35); }
.kept .item.sel .frame { border-color: var(--accent); }
.kept .item.sel .ck { background: var(--accent); border-color: var(--accent); color: #111; }
.kept .item small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); padding: 3px; border-radius: 10px; }
.tabs button { min-height: 34px; border: 0; background: transparent; color: var(--muted); font-weight: 700; }
.tabs button.on { background: var(--panel); color: var(--fg); border: 1px solid var(--line); }
/* 選んだときの操作。一覧をスクロールしても上に残す */
.kept-bar { position: sticky; top: -16px; z-index: 2; display: flex; gap: 8px; align-items: center; justify-content: center; min-height: 44px; background: var(--panel); padding: 4px 0; }
.kept-hint { color: var(--muted); font-size: 12px; }
button.danger { background: var(--danger); color: #fff; border-color: var(--danger); font-weight: 700; }
.undo { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 13px; }
.undo button { min-height: 32px; color: var(--accent); }
.kept-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 12px 0; }
.update {
  position: absolute; left: 50%; top: 48px; transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
  background: rgba(20,20,22,.95); border: 1px solid var(--accent); border-radius: 12px; padding: 6px 6px 6px 12px; font-size: 13px;
}
.update button { min-height: 32px; padding: 4px 12px; }
/* カメラの上の 3×3 グリッドと水平線 */
.cam-deco { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.grid3 {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to right, transparent calc(33.333% - .5px), rgba(255,255,255,.45) calc(33.333% - .5px), rgba(255,255,255,.45) calc(33.333% + .5px), transparent calc(33.333% + .5px),
      transparent calc(66.667% - .5px), rgba(255,255,255,.45) calc(66.667% - .5px), rgba(255,255,255,.45) calc(66.667% + .5px), transparent calc(66.667% + .5px)),
    linear-gradient(to bottom, transparent calc(33.333% - .5px), rgba(255,255,255,.45) calc(33.333% - .5px), rgba(255,255,255,.45) calc(33.333% + .5px), transparent calc(33.333% + .5px),
      transparent calc(66.667% - .5px), rgba(255,255,255,.45) calc(66.667% - .5px), rgba(255,255,255,.45) calc(66.667% + .5px), transparent calc(66.667% + .5px));
}
/* 水平線：左右の短い線は固定、まん中の線が傾きに合わせて回る。水平になると1本につながって黄色になる */
.level { position: absolute; left: 0; right: 0; top: 50%; height: 0; }
.level span { position: absolute; top: -1px; height: 2px; background: rgba(255,255,255,.85); box-shadow: 0 0 2px rgba(0,0,0,.6); }
/* 左右の線は画面の端から伸ばし、まん中の線とのあいだに少しすき間をあける */
.level .lv-l { left: 0; width: 20%; }
.level .lv-r { right: 0; width: 20%; }
.level .lv-c { left: 24%; width: 52%; transition: transform .08s linear; }
.level.flat span { background: var(--accent); }
.level.flat .lv-c { left: 0; width: 100%; }
.level.flat .lv-l, .level.flat .lv-r { opacity: 0; }
/* 前後の傾き：グリッドのまん中の列・一番下の段のマスに、スマホの形の角丸の枠。
   カメラが上を向くと上が広い台形、下を向くと下が広い台形になり、まっすぐ立つと長方形で黄色になる */
.phone-frame {
  position: absolute; left: 50%; top: 76%; width: 14%; height: 18%;
  border: 2px solid rgba(255,255,255,.9); border-radius: 10px; box-shadow: 0 0 3px rgba(0,0,0,.5);
  transform: translate(-50%, -50%) perspective(160px) rotateX(var(--px, 0deg)); transition: transform .08s linear;
}
.phone-frame.upright { border-color: var(--accent); border-width: 3px; }
.lv-tip {
  position: absolute; left: 50%; top: 64%; transform: translate(-50%, -50%); white-space: nowrap;
  font-size: 11px; font-weight: 700; color: #fff; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 99px;
}
.lv-tip.ok { background: var(--accent); color: #111; }
.lv-tip.hint { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 12px; line-height: 1.25; text-align: left; font-size: 12px; background: rgba(0,0,0,.75); }
.lv-tip.hint svg { flex: none; color: var(--accent); }
.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
.sheet {
  width: min(420px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 16px; display: grid; gap: 10px;
}
.sheet h2 { margin: 0 0 4px; font-size: 17px; }
.sheet .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sheet .row span { display: grid; gap: 2px; }
.sheet .row small { color: var(--muted); font-size: 12px; }
.sheet .row input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }
.sheet .sec { display: grid; gap: 2px; justify-items: end; flex: none; width: 130px; }
.sheet .sec input { width: 100%; height: auto; accent-color: var(--accent); }
.sheet .sec output { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sheet .note { color: var(--muted); font-size: 12px; margin: 4px 0; }
.placeholder {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px;
  color: var(--muted); padding: 12px; font-size: 13px;
}
.placeholder b { color: var(--fg); font-size: 15px; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
.flash.on { animation: flash .25s ease-out; }
@keyframes flash { from { opacity: .85 } to { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .flash.on { animation: none; } }

.result { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 0; }
.result img { max-width: 100%; max-height: calc(100% - 70px); object-fit: contain; min-height: 0; border-radius: 4px; -webkit-touch-callout: none; touch-action: none; }
.result img.checking { opacity: 0; }
.pick-zones { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.pick-zones .pz { position: absolute; pointer-events: auto; cursor: pointer; -webkit-touch-callout: none; }
.pick-zones input { display: none; }
/* 重なりチェックのスライダー（iPhoneの「スライドで電源オフ」のように、右のつまみを左へ滑らせる） */
.ck-slide {
  position: relative; width: 240px; max-width: 100%; height: 56px; border-radius: 99px; flex: none;
  background: var(--panel); border: 1px solid var(--line); touch-action: none; -webkit-touch-callout: none; user-select: none;
}
.ck-label {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-right: 48px;
  color: var(--muted); font-size: 14px; font-weight: 700; letter-spacing: .04em; pointer-events: none;
}
.ck-label b { color: var(--accent); margin-right: 6px; letter-spacing: -.1em; }
.ck-knob {
  position: absolute; right: 4px; top: 4px; width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent); color: #111; box-shadow: 0 2px 8px rgba(0,0,0,.4); cursor: grab;
}
.checker #ckBeforeLines { z-index: 4; }
.checker.lines #ckBefore { z-index: 3; }
.ck-slide.back .ck-knob, .ck-slide.back .ck-label { transition: transform .22s ease-out, opacity .22s ease-out; }
/* 重なりチェック：アフターが手前に浮き、左へドラッグするとビフォーは右へ、アフターは左へ寄って重なる */
.checker { position: fixed; z-index: 30; pointer-events: none; }
.checker canvas { position: absolute; top: 0; border-radius: 4px; will-change: transform, opacity; }
.checker #ckAfter { z-index: 2; box-shadow: 0 10px 28px rgba(0,0,0,.55); transform-origin: center; }
.checker.back canvas { transition: transform .22s ease-out, opacity .22s ease-out; }
.hint { color: var(--muted); font-size: 12px; text-align: center; }
.msg {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10;
  background: rgba(20,20,22,.92); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px;
  font-size: 13px; max-width: calc(100% - 32px); text-align: center;
}

/* 操作列：ビフォー／アフターで部品の位置が動かないよう、場所を固定したグリッドにする */
.controls { background: var(--bg); border-top: 1px solid var(--line); padding: 10px 12px 12px; }
.cap {
  display: grid; gap: 10px 12px; align-items: center;
  grid-template-columns: 1fr auto 1fr;
  grid-template-areas: "tools tools tools" "b shutter a";
}
.res { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; min-height: 72px; }
/* 文字のデザイン：書体（5種類）と位置（8か所）を選ぶ欄。完成画像を見ながら選べるよう、操作欄の中で切り替える */
.design { display: grid; gap: 8px; max-width: 520px; margin: 0 auto; }
.design h3 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 700; }
.ds-styles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.ds-styles button { min-height: 52px; padding: 4px 2px; flex-direction: column; gap: 3px; font-size: 10px; color: var(--muted); }
.ds-styles button .pv { font-size: 13px; line-height: 1.1; color: var(--fg); white-space: nowrap; }
.ds-styles button.on .pv { color: #111; }
.ds-pos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ds-pos button { min-height: 34px; padding: 4px 2px; font-size: 12px; }
.ds-foot { display: flex; justify-content: center; }
.ds-foot button { min-width: 140px; }
.side { display: contents; }
.tools { grid-area: tools; display: grid; justify-content: center; gap: 8px; }
.tool { display: flex; align-items: center; gap: 8px; }
.tint-btn { width: 76px; height: 34px; min-height: 34px; padding: 0 6px; flex: none; font-size: 12px; font-weight: 700; gap: 5px; }
.tint-btn.on { background: var(--accent); color: #111; border-color: var(--accent); }
.tint-btn.wide { width: 104px; }
.tint-main { gap: 6px; }
.tint-main.on { background: var(--panel); color: var(--fg); border-color: var(--line); }
.btn-pair { display: flex; gap: 4px; width: 104px; flex: none; }
#modeBtn { gap: 1px; padding: 0 2px; font-size: 11px; font-weight: 500; color: var(--muted); width: 62px; }
#tintBtn { width: 104px; padding: 0 6px; gap: 6px; font-size: 12px; }
#modeBtn .cur { color: var(--accent); font-weight: 800; }
.half-btn { width: 50px; height: 34px; min-height: 34px; padding: 0 4px; font-size: 12px; font-weight: 700; gap: 3px; white-space: nowrap; }
.swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); flex: none; }
.zone-a { grid-area: a; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.zone-a-row { display: flex; gap: 4px; }
.front-btn { width: 38px; height: 38px; min-height: 38px; padding: 0; border-radius: 50%; align-self: center; }
.front-btn.on { background: var(--accent); color: #111; border-color: var(--accent); }
/* レンズ：0.5x を上、1x・2x を下に並べた三角形。0.5x のないとき（インカメなど）も場所は空けておく */
.lens { display: grid; grid-template-columns: 44px 44px; grid-template-areas: "uw w1"; gap: 6px; justify-content: center; }
.lens .uw { grid-area: uw; }
.lens .w1 { grid-area: w1; }
.lens button { width: 44px; min-width: 0; height: 34px; min-height: 34px; padding: 0; border-radius: 99px; font-size: 12px; font-weight: 700; }
.ratio-btn { width: 76px; height: 34px; min-height: 34px; padding: 0; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.zone-b { grid-area: b; display: grid; gap: 6px; justify-items: center; }
.shutter-cell { grid-area: shutter; }
@media (orientation: landscape) {
  .controls {
    width: 236px; overflow-y: auto; border-top: 0; border-left: 1px solid var(--line); padding: 10px 8px;
    display: grid;
  }
  /* 横持ち：シャッターを縦方向のまん中に固定。上に重ね・自動、下にレンズと写真選択 */
  .cap {
    grid-template-columns: 1fr; justify-items: center;
    grid-template-rows: 1fr auto 1fr; gap: 8px;
    grid-template-areas: "tools" "shutter" "side";
    height: 100%;
  }
  .tools { grid-template-columns: auto auto; gap: 8px; align-self: end; }
  .tool { flex-direction: column; gap: 6px; }
  .tint-btn { width: 104px; }
  .side { grid-area: side; display: flex; flex-direction: column; gap: 8px; align-self: start; width: 100%; align-items: center; }
  .zone-a { flex-direction: row; justify-content: center; align-items: center; gap: 8px; }
  .zone-a-row { flex-direction: column; align-items: center; }
  .zone-b { grid-template-columns: 1fr 1fr; }
  .zone-b > * { min-height: 46px; font-size: 12px; }
  .zone-b { align-self: start; width: 100%; }
  .zone-b > * { width: 100%; }
  .res { flex-direction: column; align-content: center; }
  .res > * { width: 100%; }
  .ds-styles { grid-template-columns: repeat(2, 1fr); }
  .ds-pos { grid-template-columns: repeat(2, 1fr); }
}
.invis { visibility: hidden; }
.force-vis { visibility: visible; }
@media (orientation: landscape) { .topbar { top: auto; bottom: 8px; } }
.group { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
button, .btn {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 38px; text-align: center;
}
button:focus-visible, .btn:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:active, .btn:active { transform: scale(.97); }
button.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }

.overlay-btn {
  width: 104px; height: 38px; min-height: 38px; padding: 0; flex: none;
  font-weight: 700; white-space: nowrap; letter-spacing: .02em;
}
@media (orientation: landscape) { .controls .overlay-btn { width: 104px; } }
.shutter {
  width: 72px; height: 72px; border-radius: 50%; padding: 0; background: #fff;
  border: 4px solid var(--bg); box-shadow: 0 0 0 3px #fff; flex: none;
}
.slider { display: grid; gap: 2px; font-size: 11px; color: var(--muted); text-align: center; width: 128px; }
@media (orientation: landscape) { .slider { width: 104px; } }
.slider input { width: 100%; accent-color: var(--accent); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.btn input[type=file] { display: none; }
.small { font-size: 12px; padding: 6px 8px; min-height: 32px; color: var(--muted); }
</style>
</head>
<body>

<main class="stage" id="stage">
  <div class="topbar">
    <button class="gear" id="gearBtn" aria-label="設定を開く">⚙︎ 設定</button>
    <button id="keepBtn" type="button">保存した写真</button>
    <button id="makeBtn" type="button">写真から作る</button>
  </div>
  <div class="pair" id="pair">
    <div class="pane" id="paneL">
      <span class="tag" id="tagL">BEFORE</span>
      <img class="photo" id="beforeImg" alt="ビフォー写真" hidden>
      <div class="grid3 grid-before" id="grid3L" hidden></div>
      <div class="flash" id="flashL"></div>
    </div>
    <div class="pane" id="paneR">
      <span class="tag" id="tagR">AFTER</span>
      <div class="placeholder" id="phR"><b>アフター</b>先に左側でビフォーを撮るか、<br>写真から選んでください</div>
      <div class="overlay" id="overlay" hidden><img id="overlayImg" alt=""><span class="tint" id="overlayTint"></span><img id="overlayLines" alt="" hidden></div>
      <div class="badges">
        <div class="match" id="match" hidden>一致 --%</div>
      </div>
      <div class="pita" id="pita" hidden>ピタッ！</div>

      <div class="guide" id="guide" hidden></div>

      <div class="flash" id="flashR"></div>
    </div>
  </div>

  <div class="result" id="result" hidden>
    <img id="resultImg" alt="ビフォーアフター画像。左をタップするとビフォー、右をタップするとアフターを写真から選べます" draggable="false">
    <!-- 完成画像の左右の写真の上に重ねる、押せる場所（タップで写真アプリが開く） -->
    <div class="pick-zones" id="pickZones">
      <label class="pz" id="pzB" aria-label="ビフォーを写真から選ぶ"><input type="file" id="pickBInput" accept="image/*"></label>
      <label class="pz" id="pzA" aria-label="アフターを写真から選ぶ"><input type="file" id="pickAInput" accept="image/*"></label>
    </div>
    <div class="ck-slide" id="ckSlide" role="slider" aria-label="重なりチェック：つまみを左へスライドすると、ビフォーとアフターが重なります" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="ck-label" id="ckLabel">重なりチェック</span>
      <span class="ck-knob" id="ckKnob"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></span>
    </div>

  </div>

  <div class="msg" id="msg" hidden></div>
  <div class="update" id="update" hidden>新しい版があります <button class="primary" id="updateBtn" type="button">更新する</button></div>
</main>

<video id="video" playsinline muted autoplay></video>
<div class="cam-deco" id="camDeco">
  <div class="grid3" id="grid3"></div>
<div class="count" id="count" hidden aria-live="polite">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="27"></circle><circle class="fg" id="countArc" cx="32" cy="32" r="27"></circle></svg>
        <span id="countText">1.5</span>
      </div>
  <div class="level" id="level" hidden><span class="lv-l"></span><span class="lv-c" id="levelC"></span><span class="lv-r"></span></div>
  <div class="phone-frame" id="phoneFrame" hidden></div>
  <b class="lv-tip" id="levelTip" hidden></b>
</div>

<nav class="controls" id="controls">
  <!-- 撮影中：どの段階でも同じ場所に同じ部品が来る -->
  <div class="cap" id="cap">
    <div class="tools" id="tools">
      <div class="tool">
        <button class="overlay-btn tint-main" id="tintBtn" aria-label="ビフォーの線の色を切り替える（なしで線を消す）"><span class="swatch" id="tintSwatch"></span><span id="tintName">線 赤</span></button>
        <div class="slider" id="opacityWrap">
          <label for="opacity">線の濃さ <span id="opacityVal">40%</span></label>
          <input type="range" id="opacity" min="10" max="90" step="10" value="40">
        </div>
        <span class="tint-btn wide invis" aria-hidden="true"></span>
      </div>
      <div class="tool">
        <button class="overlay-btn" id="autoBtn" aria-pressed="false">自動撮影OFF</button>
        <div class="slider" id="thresholdWrap">
          <label for="threshold">一致 <span id="thresholdVal">80%</span> <span id="thresholdWord">でピタッ</span></label>
          <input type="range" id="threshold" min="50" max="90" step="5" value="80">
        </div>
        <button class="tint-btn wide" id="guideBtn" aria-pressed="false">ガイドOFF</button>
      </div>
    </div>
    <div class="shutter-cell"><button class="shutter" id="shutter" aria-label="撮影"></button></div>
    <div class="side">
    <div class="zone-a">
      <div class="lens" id="lens" aria-label="レンズ"></div>
      <div class="zone-a-row">
        <button class="ratio-btn" id="ratioBtn" aria-label="写真の縦横比を切り替える">比率 16:9</button>
        <button class="front-btn" id="frontBtn" aria-pressed="false" aria-label="インカメと背面カメラを切り替える" title="インカメ⇔背面カメラ"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11a7 7 0 0 1 13.9-1.2"/><path d="M21.3 7.6 19 10.6l-3-2.1"/><path d="M19 13a7 7 0 0 1-13.9 1.2"/><path d="M2.7 16.4 5 13.4l3 2.1"/></svg></button>
      </div>
    </div>
    <div class="zone-b">
      <label class="btn" id="pickBtn">
        <span id="pickLabel">ビフォーを写真から選ぶ</span>
        <input type="file" id="pickInput" accept="image/*">
      </label>
      <button class="small" id="redoBefore">ビフォーを撮り直す</button>
    </div>
    </div>
  </div>

  <!-- 完成 -->
  <div class="res" id="res" hidden>
    <button class="primary" id="saveBtn">保存・共有</button>
    <label class="check" id="labelWrap"><input type="checkbox" id="labelToggle" checked> 文字を入れる</label>
    <button id="designBtn" aria-label="BEFORE・AFTERの文字の書体と位置を選ぶ">文字のデザイン</button>
    <button id="ratioBtn2" aria-label="写真の縦横比を切り替える">比率 16:9</button>
    <button id="retakeAfter">アフター撮り直し</button>
    <button class="small" id="swapBtn" aria-label="ビフォーとアフターを左右入れ替える">左右入れ替え</button>
    <button class="small" id="newBtn">最初から</button>
  </div>

  <!-- 文字のデザイン（完成画面） -->
  <div class="design" id="design" hidden>
    <h3>書体</h3>
    <div class="ds-styles" id="dsStyles"></div>
    <h3>位置</h3>
    <div class="ds-pos" id="dsPos"></div>
    <div class="ds-foot"><button class="primary" id="designDone">完了</button></div>
  </div>
</nav>

<!-- 重ねて確認（完成画面） -->
<div class="checker" id="checker" hidden>
  <canvas id="ckAfter"></canvas>
  <canvas id="ckBefore"></canvas>
  <canvas id="ckBeforeLines"></canvas>
</div>

<!-- 保存した写真：ビフォー／ビフォーアフター -->
<div class="sheet-back" id="keepSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="keepTitle">
    <h2 id="keepTitle">保存した写真</h2>
    <div class="tabs" role="tablist">
      <button id="tabB" type="button" role="tab">ビフォー</button>
      <button id="tabP" type="button" role="tab">ビフォーアフター</button>
    </div>
    <p class="note" id="keptNote"></p>
    <button id="saveBeforeBtn" type="button">今のビフォーを写真に保存</button>
    <div class="kept-bar" id="keptBar">
      <span class="kept-hint" id="keptHint">タップで選ぶ・横になぞるとまとめて選べます</span>
      <button class="primary" id="keptOpen" type="button" hidden>開く</button>
      <button class="danger" id="keptDel" type="button" hidden>削除</button>
      <button class="small" id="keptClear" type="button" hidden>選択解除</button>
    </div>
    <div class="undo" id="undoBar" hidden><span id="undoText"></span><button id="undoBtn" type="button">元に戻す</button></div>
    <div class="kept" id="keptList"></div>
    <p class="note">ホーム画面に追加して使うと、保存した写真が消えにくくなります。大事なものは写真アプリにも保存してください。</p>
    <button class="primary" id="keepClose">閉じる</button>
  </div>
</div>

<!-- 設定 -->
<div class="sheet-back" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">設定</h2>
    <label class="row"><span><b>ピタッの音</b><small>ビフォーと合ったときに「ピッピッ」と鳴らす</small></span><input type="checkbox" id="setPing"></label>
    <label class="row"><span><b>シャッター音</b><small>撮影したときに「カシャ」と鳴らす</small></span><input type="checkbox" id="setShutter"></label>
    <div class="row"><span><b>ビフォーの自動撮影までの時間</b><small>水平・垂直がそろってから撮るまで。じっくり構えたいときは長めに</small></span>
      <span class="sec"><input type="range" id="setCountB" min="0.5" max="2" step="0.1" value="1"><output id="setCountBVal">1.0秒</output></span></div>
    <label class="row"><span><b>グリッド</b><small>カメラの上に 3×3 の線を出す</small></span><input type="checkbox" id="setGrid"></label>
    <label class="row"><span><b>手前（画面の下のほう）も合わせる</b><small>奥の壁や天井だけでなく、手前の家具や床も合っているときだけピタッにする。立ち位置まで合わせられる。手前の家具を動かす片付けではOFFに</small></span><input type="checkbox" id="setFront"></label>
    <label class="row"><span><b>水平・垂直ガイド</b><small>まん中の線が左右の傾きで回り（水平で黄色の1本に）、下のスマホ形の枠が前後の傾きで台形になる（まっすぐ立つと黄色に）</small></span><input type="checkbox" id="setLevel"></label>
    <p class="note">マナーモード（消音）のときは、音が鳴らないことがあります。</p>
    <p class="note">版：<span id="verText"></span>　<button class="small" id="checkUpdate" type="button">新しい版を確認</button></p>
    <button class="primary" id="sheetClose">閉じる</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const video = $('video');
  const MAX_H = 2400;          // 1枚あたりの最大の高さ(px)。iPhoneのメモリ上限に余裕を持たせる
  // 1枚ごとの縦横比（幅／高さ）。どれも縦長
  const RATIOS = [
    { key: '169', name: '16:9', ar: 9 / 16 },
    { key: '43',  name: '4:3',  ar: 3 / 4 },
    { key: '11',  name: '1:1',  ar: 1 },
  ];
  let ratioIdx = Math.max(0, RATIOS.findIndex(r => r.key === (() => { try { return JSON.parse(localStorage.getItem('bacam.ratio')); } catch { return null; } })()));
  let AR = RATIOS[ratioIdx].ar;

  const store = {
    get(k, d) { try { const v = localStorage.getItem('bacam.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('bacam.' + k, JSON.stringify(v)); } catch {} },
  };

  let state = 'before';        // before | after | result
  let stream = null;
  let cams = [];               // {id, key, name}
  let lensKey = store.get('lens', 'uw') === 'x2' ? 'wide' : store.get('lens', 'uw');   // 2x はなくした
  let starting = null;
  let beforeCanvas = null, afterCanvas = null;
  let beforeFull = null, afterFull = null;   // 切り抜く前の写真（比率を後から変えられるように残す）
  let beforeURL = null, resultBlob = null, resultURL = null;
  let overlayOn = true;   // 線の色が「なし」でなければ重ねる（render で決める）
  // 前の版で保存した値も、今の目盛り（範囲と刻み）に合わせる
  const snap = (v, min, max, step, d) => { v = Number(v); if (!isFinite(v)) v = d; return Math.min(max, Math.max(min, Math.round((v - min) / step) * step + min)); };
  let opacity = snap(store.get('opacity', 40), 10, 90, 10, 40);
  let msgTimer = null;
  let autoOn = store.get('autoOn', false);
  const TINTS = [
    { key: 'red',   name: '赤', css: 'rgba(255, 30, 30, 0.4)',  line: [255, 50, 50] },
    { key: 'blue',  name: '青', css: 'rgba(30, 110, 255, 0.4)', line: [60, 150, 255] },
    { key: 'green', name: '緑', css: 'rgba(30, 220, 70, 0.4)',  line: [40, 235, 90] },
    { key: 'none',  name: 'なし', css: 'transparent',            line: [255, 50, 50] },
  ];
  let tintIdx = Math.max(0, TINTS.findIndex(t => t.key === store.get('tint', 'red')));
  const settings = { ping: store.get('setPing', true), shutterSound: store.get('setShutter', true), tilt: store.get('setTilt', true),
    // 範囲と初期値を変えたので、保存先の名前も変えて初期値から始める
    countSec: 0.3,   // アフターは最後の微調整でほぼブレないので、ピタッから0.3秒で撮る（固定）
    countBefore: Math.round(snap(store.get('setCountB2', 1), 0.5, 2, 0.1, 1) * 10) / 10,
    grid: store.get('setGrid', true), level: store.get('setLevel', true), front: store.get('setFront', true) };   // 測り方を変えたので、保存先の名前も変えてONから始める
  const lineMode = true;   // 撮影中はビフォーの輪郭の線だけを重ねる（写真の重ね合わせは完成画面の確認で使う）
  let lineMask = null, lineURL = null, lineColorKey = null;
  let guide = null;
  let guideOn = false;   // 最初はガイドなしで合わせ、最後の微調整で使う想定。アフター画面に入るたびにOFFから始める
  let threshold = snap(store.get('threshold', 80), 50, 90, 5, 80);
  let beforeFeat = null, matchScore = null, holdSince = 0, afterEnteredAt = 0, shooting = false;

  $('labelToggle').checked = store.get('labels', true);
  $('opacity').value = opacity;

  function msg(text, ms = 3500) {
    const el = $('msg'); el.textContent = text; el.hidden = false;
    clearTimeout(msgTimer); if (ms) msgTimer = setTimeout(() => el.hidden = true, ms);
  }

  // ---------- カメラ ----------
  // レンズの選択肢：背面は 0.5x（超広角）／1x／2x（1xの映像を中央2倍に切り出す）、インカメは 1x／2x
  // 望遠（3x・5x）は、ボタンが並びきらないので出していない
  let frontCam = null;        // インカメ（前面カメラ）
  let facing = store.get('facing', 'back');   // 'back' | 'user'
  let dzoom = 1;              // 画面の中で拡大する倍率（2x のとき 2）
  let mirror = false;         // インカメのときは鏡のように左右反転して表示・保存する
  function classify(label, i) {
    const l = (label || '').toLowerCase();
    if (/前面|front|user|facetime/.test(l)) return { key: 'front', name: 'イン', front: true };
    if (/超広角|ultra ?wide/.test(l)) return { key: 'uw', name: '0.5x' };
    if (/デュアル|トリプル|dual|triple/.test(l)) return null;
    if (/望遠|telephoto/.test(l)) return { key: 'tele', name: '望遠' };
    if (/背面|back|rear|environment/.test(l)) return { key: 'wide', name: '1x' };
    return { key: 'cam' + i, name: 'カメラ' + (i + 1) };
  }

  async function listCams() {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const out = [], seen = {};
    devs.forEach((d, i) => {
      const c = classify(d.label, i); if (!c) return;
      if (c.front) { if (!frontCam) frontCam = { id: d.deviceId }; return; }
      if (c.key === 'tele') return;
      if (seen[c.key]) { seen[c.key]++; c.key += seen[c.key]; c.name += '-' + seen[c.key]; } else seen[c.key] = 1;
      out.push({ id: d.deviceId, zoom: 1, ...c });
    });
    const order = { uw: 0, wide: 1 };
    out.sort((a, b) => (order[a.key] ?? 9) - (order[b.key] ?? 9));
    const base = out.find(c => c.key === 'wide') || out.find(c => c.key !== 'uw') || out[0];
    return out;
  }

  function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; video.srcObject = null;
  }

  async function open(constraint) {
    stopCamera();
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { ...constraint, width: { ideal: 4032 }, height: { ideal: 3024 } },
    });
    video.srcObject = stream;
    try { await video.play(); } catch {}
  }

  // 今のレンズの選択肢（背面かインカメか）
  function lensOptions() {
    if (facing === 'user') {
      if (!frontCam) return [];
      return [{ id: frontCam.id, key: 'f1', name: '1x', zoom: 1, front: true }];
    }
    return cams;
  }
  function curLens() { return lensOptions().find(c => c.key === (facing === 'user' ? frontKey : lensKey)); }
  let frontKey = 'f1';
  function applyView() {
    const L = curLens();
    dzoom = L ? L.zoom : 1;
    mirror = facing === 'user';
    video.style.transform = (mirror ? 'scaleX(-1) ' : '') + (dzoom !== 1 ? 'scale(' + dzoom + ')' : '');
  }

  async function startCamera() {
    if (starting) return starting;
    starting = (async () => {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error(location.protocol === 'https:' ? 'このブラウザはカメラに対応していません' : 'https のページで開いてください');
      }
      if (facing === 'user') {
        // インカメ：IDがわかっていればそれで、なければ「前面」を指定して開く
        await open(frontCam ? { deviceId: { exact: frontCam.id } } : { facingMode: { exact: 'user' } });
        if (!cams.length) cams = await listCams();
        applyView(); renderLens();
        return;
      }
      // 前回使ったレンズのIDで直接開き、カメラの起動を1回で済ませる（起動のたびにブラウザの通知が出るため）
      const want = cams.find(c => c.key === lensKey);
      const savedId = store.get('camId', null);
      if (want) await open({ deviceId: { exact: want.id } });
      else if (savedId) {
        try { await open({ deviceId: { exact: savedId } }); }
        catch (e) {
          if (e.name === 'NotAllowedError' || e.name === 'SecurityError') throw e;
          await open({ facingMode: { ideal: 'environment' } });
        }
      } else await open({ facingMode: { ideal: 'environment' } });
      if (!cams.length) {
        cams = await listCams();
        const cur = stream.getVideoTracks()[0]?.getSettings().deviceId;
        const pref = cams.find(c => c.key === lensKey) || cams.find(c => c.id === cur) || cams[0];
        if (pref && pref.id !== cur) await open({ deviceId: { exact: pref.id } });
        if (pref) lensKey = pref.key;
      }
      store.set('camId', (cams.find(c => c.key === lensKey) || {}).id || stream.getVideoTracks()[0]?.getSettings().deviceId || null);
      applyView(); renderLens();
    })().catch(err => {
      stopCamera();
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      showCamError(denied
        ? 'カメラの使用が許可されていません。Chromeはアドレスバー左のアイコン、Safariは「ぁあ」→「Webサイトの設定」から、カメラを「許可」にしてください。'
        : 'カメラを起動できませんでした（' + (err.message || err.name) + '）');
    }).finally(() => { starting = null; });
    return starting;
  }

  function showCamError(text) {
    const pane = state === 'before' ? $('paneL') : $('paneR');
    let ph = pane.querySelector('.camerr');
    if (!ph) { ph = document.createElement('div'); ph.className = 'placeholder camerr'; pane.appendChild(ph); }

  function renderLens() {

    const slots = {

  // ---------- 画像処理 ----------
  // 大きな作業用の画像（写真1枚分）。使わなくなったものはすぐ片付ける（iPhone は画像のメモリの上限が小さく、
  // 片付けが遅れるとたまって、新しい画像が作れなくなる＝写真を選んでも表示されないことがある）
  const bigs = new Set();

  function cropCover(src, sw, sh) {
    let cw, ch;

    const sx = (sw - cw) / 2, sy = (sh - ch) / 2;
    const s = Math.min(1, MAX_H / ch);

    c.width = Math.round(cw * s); c.height = Math.round(ch * s);

    bigs.add(c);

  // 切り抜かずに、長い辺を MAX_H までに縮めて取っておく
  // z：中央を z 倍に切り出す（2x 用）／flip：左右反転（インカメ用）
  function fullCanvas(src, sw, sh, z = 1, flip = false) {
    const cw = sw / z, ch = sh / z, sx = (sw - cw) / 2, sy = (sh - ch) / 2;
    const s = Math.min(1, MAX_H / Math.max(cw, ch));
    const c = document.createElement('canvas');
    c.width = Math.round(cw * s); c.height = Math.round(ch * s);
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
    if (flip) { g.translate(c.width, 0); g.scale(-1, 1); }
    g.drawImage(src, sx, sy, cw, ch, 0, 0, c.width, c.height);
    bigs.add(c);
    return c;
  }
  const cropOf = (c) => cropCover(c, c.width, c.height);

  function grabFrame() {
    if (!stream || !video.videoWidth) return null;
    return fullCanvas(video, video.videoWidth, video.videoHeight, dzoom, mirror);
  }

  // 画像を読み込む。iPhone の Safari は img.decode() が、読めているのに失敗扱いになることがあるので、onload で待つ
  function loadImage(url) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => (img.naturalWidth ? res(img) : rej(new Error('empty')));
      img.onerror = () => rej(new Error('load'));
      img.src = url;
    });
  }
  async function loadBlob(blob) {
    const url = URL.createObjectURL(blob);

    finally { URL.revokeObjectURL(url); }
  }
  const loadFile = loadBlob;
  // 写真を選んでから表示されるまで（変換や下準備で時間がかかることがある）は「読み込み中」を出す。
  // 続けて選んだときは、順番に1つずつ処理する
  let pickQueue = Promise.resolve();
  function withLoading(job) {
    pickQueue = pickQueue.then(async () => {

      try { await job(); $('msg').hidden = true; }
      catch (err) { console.warn(err); msg('この写真は読み込めませんでした。もう一度選ぶか、別の写真を選んでください', 6000); }
    });
    return pickQueue;
  }

  const toBlob = (c, q = 0.92) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('画像を作れませんでした')), 'image/jpeg', q));

  // ---------- BEFORE・AFTER の文字：書体（5種類）と位置（8か所） ----------
  // 書体は iPhone に入っているものを使う（電波がなくても保存画像に入る）。ほかの端末では似た書体になる
  const FONT_SANS = '-apple-system, "Helvetica Neue", Arial, sans-serif';
  const FONT_MINCHO = '"Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", YuMincho, "Noto Serif JP", "Noto Serif CJK JP", serif';
  const FONT_DIDOT = 'Didot, "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif';
  const FONT_MODERN = '"Avenir Next", Avenir, Futura, "Century Gothic", "Helvetica Neue", Arial, sans-serif';
  const FONT_ROUND = '"Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", "M PLUS Rounded 1c", "Rounded Mplus 1c", ' + FONT_SANS;
  // 文字を1字ずつ、字間をあけて書く（letterSpacing に対応していない端末でも同じ見た目にする）
  function spacedWidth(g, t, sp) { let w = 0; for (const ch of t) w += g.measureText(ch).width + sp; return w - sp; }

  // 各書体：text＝文字、font＝書体、size＝文字の箱の大きさ、draw＝箱の左上 (x, y) から描く。out＝写真の枠の外（白地）に置くとき
  const LABEL_STYLES = [
    { key: 'std', name: '標準', pvFont: FONT_SANS, pvWeight: 800,
      text: (a) => a ? 'AFTER' : 'BEFORE', font: (fs) => `800 ${fs}px ${FONT_SANS}`, sp: 0,
      box(g, t, fs) { const pad = fs * 0.55; return { w: g.measureText(t).width + pad * 2, h: fs + pad * 1.2 }; },
      draw(g, t, x, y, b, fs, a) {
        const pad = fs * 0.55;
        g.fillStyle = a ? 'rgba(255,210,63,0.95)' : 'rgba(0,0,0,0.6)'; roundRect(g, x, y, b.w, b.h, b.h / 2); g.fill();
        g.fillStyle = a ? '#111111' : '#ffffff'; g.fillText(t, x + pad, y + b.h / 2 + fs * 0.04);
      } },
    { key: 'mincho', name: '明朝', pvFont: FONT_MINCHO, pvWeight: 600,
      text: (a) => a ? 'After' : 'Before', font: (fs) => `600 ${fs * 1.15}px ${FONT_MINCHO}`, sp: 0.06,
      box(g, t, fs) { return { w: spacedWidth(g, t, fs * this.sp) + fs * 0.2, h: fs * 1.75 }; },
      draw(g, t, x, y, b, fs, a, out) {

        g.fillStyle = col; spacedText(g, t, x + fs * 0.1, y + fs * 0.7, fs * this.sp);

      } },
    { key: 'classic', name: 'クラシック', pvFont: FONT_DIDOT, pvWeight: 400, pvItalic: true,
      text: (a) => a ? 'After' : 'Before', font: (fs) => `italic 400 ${fs * 1.3}px ${FONT_DIDOT}`, sp: 0,
      box(g, t, fs) { return { w: g.measureText(t).width + fs * 1.3, h: fs * 1.9 }; },
      draw(g, t, x, y, b, fs, a, out) {

        if (!out) { g.fillStyle = 'rgba(255,255,255,0.88)'; g.fillRect(x, y, b.w, b.h); }
        g.fillStyle = '#111111'; g.fillText(t, x + fs * 0.65, y + b.h / 2);
        if (out) { const lw = Math.max(1, fs * 0.04); g.fillRect(x + fs * 0.4, y + fs * 0.1, b.w - fs * 0.8, lw); g.fillRect(x + fs * 0.4, y + b.h - fs * 0.1 - lw, b.w - fs * 0.8, lw); }
      } },
    { key: 'modern', name: 'モダン', pvFont: FONT_MODERN, pvWeight: 500,
      text: (a) => a ? 'AFTER' : 'BEFORE', font: (fs) => `500 ${fs * 0.78}px ${FONT_MODERN}`, sp: 0.32,
      box(g, t, fs) { return { w: spacedWidth(g, t, fs * this.sp) + fs * 1.4, h: fs * 1.55 }; },
      draw(g, t, x, y, b, fs, a, out) {
        // 字間を広くとった細めの文字。ビフォーは黒の四角、アフターは白の四角に黒の縁
        const lw = Math.max(1, fs * 0.06);
        g.fillStyle = a ? '#ffffff' : '#111111'; g.fillRect(x, y, b.w, b.h);
        if (a || out) { g.strokeStyle = '#111111'; g.lineWidth = lw; g.strokeRect(x + lw / 2, y + lw / 2, b.w - lw, b.h - lw); }
        g.fillStyle = a ? '#111111' : '#ffffff'; spacedText(g, t, x + fs * 0.7, y + b.h / 2 + fs * 0.03, fs * this.sp);
      } },
    { key: 'pop', name: 'ポップ', pvFont: FONT_ROUND, pvWeight: 800,
      text: (a) => a ? 'AFTER!' : 'BEFORE', font: (fs) => `800 ${fs * 1.05}px ${FONT_ROUND}`, sp: 0,
      box(g, t, fs) { const pad = fs * 0.6; return { w: g.measureText(t).width + pad * 2, h: fs * 1.8 }; },
      draw(g, t, x, y, b, fs, a) {

        g.fillStyle = a ? '#ff7a2f' : '#3d7bf2'; roundRect(g, -b.w / 2, -b.h / 2, b.w, b.h, b.h / 2); g.fill();
        g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.fillText(t, 0, fs * 0.05);
        g.restore();
      } },
  ];
  const LABEL_POS = [
    { key: 'tl', name: '左上' }, { key: 'tc', name: '中央上' }, { key: 'tr', name: '右上' }, { key: 'ot', name: '枠の外・上' },
    { key: 'bl', name: '左下' }, { key: 'bc', name: '中央下' }, { key: 'br', name: '右下' }, { key: 'ob', name: '枠の外・下' },
  ];
  let labelStyle = Math.max(0, LABEL_STYLES.findIndex(t => t.key === store.get('labelStyle', 'std')));
  let labelPos = Math.max(0, LABEL_POS.findIndex(t => t.key === store.get('labelPos', 'tl')));
  let layout = { top: 0 };   // 完成画像の中で、写真が始まる高さ（枠の外・上に文字を置くとき下がる）

  // まだ選んでいない側の、仮の絵（「タップしてビフォーを選ぶ」）

  function compose(withLabels) {
    const hs = [beforeCanvas, afterCanvas].filter(Boolean).map(c => c.height);
    const H = hs.length ? Math.min(...hs) : 1600;
    const W = Math.round(H * AR);
    const gap = Math.round(W * 0.02);
    const pos = LABEL_POS[labelPos].key, st = LABEL_STYLES[labelStyle];
    const fs = Math.round(H * 0.05), m = Math.round(H * 0.03);
    // 枠の外に置くときは、写真の上か下に白い帯を足して、そこに文字を置く

        const t = st.text(a), b = st.box(g, t, fs), px = a ? W + gap : 0;

  async function go(next) {
    state = next; clearCamError(); sweep();
    if (next === 'before') { beforeEnteredAt = performance.now(); holdSince = 0; }
    if (next === 'after' && beforeCanvas && !beforeFeat) analyzeBefore();
    if (next === 'after') { lastLive = null; afterEnteredAt = performance.now(); matchScore = null; holdSince = 0; guide = null; guideOn = false; aligned = false; }
    if (next !== 'after') { $('pita').hidden = true; $('paneR').classList.remove('aligned'); }
    render();
    // 完成画面でもカメラは止めない（撮り直しのたびにカメラを起動し直さないため）
    if (next !== 'result' && !cameraAlive()) await startCamera();
  }

  // 画面のビフォーは切り抜く前の写真を枠いっぱいに表示する（枠の比率で自動的に切り抜かれて見える）
  async function setBefore(full, opt = {}) {
    newProject();
    await prepareBefore(full, opt);
    await go('after');
  }
  // analyze：アフター撮影用の下準備（一致度・線）をすぐするか。完成画面で写真を選ぶときは後回しにして、
  // アフターを撮る画面に入るときにする（選んだ直後もすぐ次のタップができるように）
  async function prepareBefore(full, { keep = false, analyze = true } = {}) {
    beforeFull = full;

      : 'ビフォーアフターは作るたびに保存されます（新しい30件まで）。開くと、文字や比率をあとから直せます。';
    const box = $('keptList'); box.innerHTML = ''; box.classList.toggle('wide', keptTab === 'projects');
    try { keptRecs = (await db[keptTab].all()).sort((a, b) => b.id - a.id); } catch { keptRecs = []; }
    keptSel = new Set([...keptSel].filter(id => keptRecs.some(r => r.id === id)));
    if (!keptRecs.length) box.innerHTML = '<div class="kept-empty" style="grid-column: 1 / -1">まだありません</div>';
    keptRecs.forEach((r, i) => {
      const it = document.createElement('div'); it.className = 'item'; it.dataset.i = i;
      it.setAttribute('role', 'checkbox'); it.tabIndex = 0;
      it.setAttribute('aria-label', fmtDate(r.updated || r.id) + (keptTab === 'befores' ? ' のビフォー' : ' のビフォーアフター'));
      const fr = document.createElement('div'); fr.className = 'frame';
      const im = document.createElement('img'); im.src = r.thumb; im.alt = ''; im.draggable = false; fr.appendChild(im);
      const ck = document.createElement('span'); ck.className = 'ck'; ck.textContent = '✓'; fr.appendChild(ck);
      const dt = document.createElement('small'); dt.textContent = fmtDate(r.updated || r.id);
      it.append(fr, dt); box.appendChild(it);
      it.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleSel(r.id); } };
    });
    paintSel();
  }
  function paintSel() {
    $('keptList').querySelectorAll('.item').forEach(it => {
      const on = keptSel.has(keptRecs[+it.dataset.i].id);
      it.classList.toggle('sel', on); it.setAttribute('aria-checked', String(on));
    });
    const n = keptSel.size, bar = $('keptBar');
    $('keptOpen').hidden = n !== 1;
    $('keptDel').hidden = n === 0; $('keptDel').textContent = n > 1 ? `削除（${n}枚）` : '削除';
    $('keptClear').hidden = n === 0;
    $('keptHint').hidden = n !== 0;
    bar.classList.toggle('active', n > 0);
  }
  function toggleSel(id) { keptSel.has(id) ? keptSel.delete(id) : keptSel.add(id); paintSel(); }
  // なぞって選ぶ：横に動かし始めたら選ぶ（縦はスクロール）。動かした範囲をまとめて選ぶ／外す
  {
    const box = $('keptList');
    let drag = null;
    const itemAt = (x, y) => { const el = document.elementFromPoint(x, y); const it = el && el.closest('#keptList .item'); return it ? +it.dataset.i : null; };
    box.addEventListener('pointerdown', (e) => {
      const it = e.target.closest('.item'); if (!it) return;
      drag = { start: +it.dataset.i, x: e.clientX, y: e.clientY, mode: null, base: new Set(keptSel), id: e.pointerId };
    });
    box.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.mode) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (Math.hypot(dx, dy) < 10) return;
        if (Math.abs(dx) >= Math.abs(dy) || e.pointerType === 'mouse') {
          drag.mode = 'select'; drag.add = !keptSel.has(keptRecs[drag.start].id);
          try { box.setPointerCapture(e.pointerId); } catch {}
        } else { drag.mode = 'scroll'; return; }
      }
      if (drag.mode !== 'select') return;
      e.preventDefault();
      const i = itemAt(e.clientX, e.clientY); if (i == null) return;
      keptSel = new Set(drag.base);
      for (let k = Math.min(drag.start, i); k <= Math.max(drag.start, i); k++) drag.add ? keptSel.add(keptRecs[k].id) : keptSel.delete(keptRecs[k].id);
      paintSel();
    });
    box.addEventListener('touchmove', (e) => { if (drag && drag.mode === 'select') e.preventDefault(); }, { passive: false });
    box.addEventListener('pointerup', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.mode) toggleSel(keptRecs[drag.start].id);   // 動かさずに離した＝タップ
      drag = null;
    });
    box.addEventListener('pointercancel', () => { drag = null; });
  }
  $('keptOpen').onclick = () => {
    const r = keptRecs.find(x => keptSel.has(x.id)); if (!r) return;
    keptSel.clear();
    keptTab === 'befores' ? recallBefore(r) : openProject(r);
  };
  $('keptClear').onclick = () => { keptSel.clear(); paintSel(); };
  $('keptDel').onclick = async () => {
    const tab = keptTab, recs = keptRecs.filter(r => keptSel.has(r.id));
    if (!recs.length) return;
    for (const r of recs) await db[tab].del(r.id);
    if (tab === 'projects' && recs.some(r => r.id === projectId)) projectId = null;
    keptSel.clear();
    undoData = { tab, recs };
    $('undoText').textContent = `${recs.length}${tab === 'befores' ? '枚' : '件'}消しました`;
    $('undoBar').hidden = false;
    clearTimeout(undoTimer); undoTimer = setTimeout(() => { $('undoBar').hidden = true; undoData = null; }, 10000);
    await renderKept();
  };
  $('undoBtn').onclick = async () => {
    if (!undoData) return;
    for (const r of undoData.recs) await db[undoData.tab].put(r);
    keptTab = undoData.tab; undoData = null; $('undoBar').hidden = true; clearTimeout(undoTimer);
    await renderKept();
  };
  $('tabB').onclick = () => { if (keptTab !== 'befores') { keptTab = 'befores'; keptSel.clear(); renderKept(); } };
  $('tabP').onclick = () => { if (keptTab !== 'projects') { keptTab = 'projects'; keptSel.clear(); renderKept(); } };
  // 左上の「保存した写真」：どの画面からでも開ける。アフター画面では、今のビフォーを写真に保存できる
  $('keepBtn').onclick = async () => {
    keptSel.clear(); $('undoBar').hidden = true; undoData = null;
    keptTab = state === 'result' ? 'projects' : 'befores';
    await renderKept(); $('keepSheet').hidden = false; $('keepClose').focus();
  };
  $('saveBeforeBtn').onclick = async () => { if (beforeFull) await shareImage(await toBlob(beforeFull, 0.92), `Before_${stamp()}.jpg`); };
  $('keepClose').onclick = () => { $('keepSheet').hidden = true; };
  $('keepSheet').addEventListener('click', (e) => { if (e.target === $('keepSheet')) $('keepSheet').hidden = true; });

  // ---------- 写真から作る（撮影しない）：完成画面の左（ビフォー）・右（アフター）をタップして、写真アプリから選ぶ ----------
  $('makeBtn').onclick = async () => {
    beforeCanvas = afterCanvas = beforeFull = afterFull = null; beforeFeat = null; beforeLines = null; tiltBefore = null;
    newProject();
    await buildResult();
    await go('result');
  };
  // 押せる場所を、完成画像の中のビフォー・アフターの写真の位置に合わせる（白いすき間や文字の帯は除く）
  function placeZones() {
    if (state !== 'result' || !$('resultImg').naturalWidth) return;
    const r = $('resultImg').getBoundingClientRect(), st = $('stage').getBoundingClientRect();
    const hs = [beforeCanvas, afterCanvas].filter(Boolean).map(c => c.height);
    const H = hs.length ? Math.min(...hs) : 1600, W = Math.round(H * AR), gap = Math.round(W * 0.02), k = r.width / (W * 2 + gap);
    const set = (el, x) => Object.assign(el.style, { left: (r.left - st.left + x) + 'px', top: (r.top - st.top + layout.top * k) + 'px', width: (W * k) + 'px', height: (H * k) + 'px' });
    set($('pzB'), 0); set($('pzA'), (W + gap) * k);
  }
  $('resultImg').addEventListener('load', placeZones);
  window.addEventListener('resize', placeZones);
  $('pickBInput').onchange = (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    withLoading(async () => { const c = await loadFile(file); tiltBefore = null; await prepareBefore(c, { analyze: false }); imagesDirty = true; await buildResult(); render(); });
  };
  $('pickAInput').onchange = (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    withLoading(async () => { const c = await loadFile(file); afterFull = c; afterCanvas = cropOf(c); imagesDirty = true; await buildResult(); render(); });
  };
  // 完成画面：ビフォーとアフターを左右入れ替える
  $('swapBtn').onclick = async () => {
    const b = beforeFull, a = afterFull;
    if (!b && !a) return;
    tiltBefore = null;
    if (a) await prepareBefore(a, { analyze: false }); else { beforeFull = beforeCanvas = beforeFeat = beforeLines = null; }
    afterFull = b; afterCanvas = b ? cropOf(b) : null; imagesDirty = true;
    await buildResult(); render();
  };

  function cameraAlive() {
    const t = stream && stream.getVideoTracks()[0];
    return !!t && t.readyState === 'live';
  }
  // アプリに戻ったとき、カメラが止められていた場合だけ起動し直す
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state !== 'result' && !cameraAlive()) startCamera();
    if (!document.hidden) video.play().catch(() => {});
  });

  try { navigator.wakeLock?.request('screen').catch(() => {}); } catch {}

  render();
  startCamera();
})();
</script>
</body>
</html>
